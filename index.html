tent.com/aleleosedova/surprise/main/images/rue-chaillot.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "reservoirs-passy", "lat": 48.871, "lng": 2.288, "lb": {"ru": "РЕЗЕРВУАРЫ ПАССИ", "en": "PASSY RESERVOIRS"}, "t": {"ru": "Резервуары Пасси", "en": "The Passy Reservoirs"}, "s": {"ru": "16-й округ · 1858–1866 · Эжен Бельгран · 57 000 м³", "en": "16th arr. · 1858–1866 · Eugène Belgrand · 57,000 m³"}, "h": {"ru": "<p>Гигантский резервуар непитьевой воды на холме Шайо. Построен в 1858–1866 инженером Эженом Бельграном — главным архитектором парижской воды при Османе. Полузаглублён, окружён османовскими домами, как искусственное озеро посреди города.</p><div class=\"p-sc\">Что там сейчас</div><p>В 1898 добавили открытый бассейн «Коперник» (22 000 м³, 13 000 м²) и три подземных. Общая ёмкость — 57 000 м³. Сегодня вода питает каскады Булонского леса, поливает парки западного Парижа и моет улицы. Подземная часть — высокие сводчатые галереи 6 м высотой.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/reservoirs-passy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/reservoirs-passy-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A giant reservoir of non-potable water on the Chaillot hill. Built in 1858–1866 by the engineer Eugène Belgrand — Haussmann’s chief architect of the Paris water supply. Half-buried and ringed by Haussmann-era buildings, like an artificial lake in the middle of the city.</p><div class='p-sc'>What’s there now</div><p>In 1898 an open «Copernic» basin was added (22,000 m³, 13,000 m²) along with three underground ones. Total capacity is 57,000 m³. Today the water feeds the cascades of the Bois de Boulogne, irrigates the parks of western Paris and washes the streets. The underground part is high vaulted galleries 6 m tall.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/reservoirs-passy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/reservoirs-passy-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "lignes-fuite", "lat": 48.833, "lng": 2.352, "lb": {"ru": "ЛИНИИ ПЕРСПЕКТИВЫ", "en": "VANISHING LINES"}, "t": {"ru": "Линии перспективы", "en": "Vanishing Lines"}, "s": {"ru": "Rue Abel Hovelacque, 13-й округ · Параллельные галереи", "en": "Rue Abel-Hovelacque, 13th arr. · Parallel galleries"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lignes-fuite.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lignes-fuite.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "moulin-13", "lat": 48.833, "lng": 2.349, "lb": {"ru": "МЕЛЬНИЦА 13-ГО", "en": "MILL OF THE 13TH"}, "t": {"ru": "Мельница 13-го округа", "en": "Mill of the 13th arrondissement"}, "s": {"ru": "Boulevard Auguste Blanqui · 13-й округ", "en": "Boulevard Auguste-Blanqui · 13th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/moulin-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/moulin-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "regard-xxiii", "lat": 48.822, "lng": 2.342, "lb": {"ru": "REGARD XXIII", "en": "REGARD XXIII"}, "t": {"ru": "Regard XXIII Акведука Медичи", "en": "Regard XXIII of the Medici Aqueduct"}, "s": {"ru": "Jardin de l’aqueduc · ZAC Alésia-Montsouris", "en": "Jardin de l’aqueduc · ZAC Alésia-Montsouris"}, "h": {"ru": "<p>Один из «смотровых колодцев» (regards) Акведука Медичи — 13-километрового подземного водовода, построенного в 1613–1623 по приказу Марии Медичи для питания её Люксембургского дворца. Вода шла из источников Ranжис в Val-de-Marne и поступала в «Maison du Fontainier» на авеню Обсерватории.</p><div class=\"p-sc\">Реплика 1996 года</div><p>Оригинальный regard XXIII, известный как «Ferme de la Santé», был снесён в 1996 при создании ZAC Alésia-Montsouris. На его месте возведена реплика по образцу сохранившегося regard XXV. Всего вдоль акведука было 27 regards; 23 дошли до наших дней. Акведук до сих пор работает — только теперь вода идёт не во дворец, а в каскад парка Монсури.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/regard-xxiii.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>One of the «inspection wells» (regards) of the Medici Aqueduct — a 13-kilometre underground conduit built in 1613–1623 on the orders of Marie de’ Medici to supply her Luxembourg Palace. The water came from the springs of Rungis in the Val-de-Marne and arrived at the «Maison du Fontainier» on Avenue de l’Observatoire.</p><div class='p-sc'>A 1996 replica</div><p>The original regard XXIII, known as the «Ferme de la Santé», was demolished in 1996 during the creation of the ZAC Alésia-Montsouris. A replica was built in its place, modelled on the surviving regard XXV. There were 27 regards in all along the aqueduct; 23 have come down to us. The aqueduct still works — only now the water goes not to a palace but to the cascade of Montsouris park.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/regard-xxiii.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-fleurus", "lat": 48.845, "lng": 2.333, "lb": {"ru": "RUE DE FLEURUS", "en": "RUE DE FLEURUS"}, "t": {"ru": "Под улицей Флёрюс", "en": "Beneath Rue de Fleurus"}, "s": {"ru": "6-й округ", "en": "6th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-fleurus.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-fleurus.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "embranchement-inonde", "lat": 48.828, "lng": 2.331, "lb": {"ru": "ЗАТОПЛЕННАЯ РАЗВИЛКА", "en": "FLOODED JUNCTION"}, "t": {"ru": "Затопленная развилка", "en": "The Flooded Junction"}, "s": {"ru": "Angle Alésia/Lunain, 14-й округ", "en": "Corner of Alésia/Lunain, 14th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/embranchement-inonde.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/embranchement-inonde.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "azurs-perdus", "lat": 48.834, "lng": 2.326, "lb": {"ru": "ПОТЕРЯННАЯ ЛАЗУРЬ", "en": "LOST AZURE"}, "t": {"ru": "Потерянная лазурь", "en": "The Lost Azure"}, "s": {"ru": "Rue Daguerre, 14-й округ · Les azurs perdus", "en": "Rue Daguerre, 14th arr. · Les azurs perdus"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/azurs-perdus.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/azurs-perdus.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "puits-rochefoucauld", "lat": 48.831, "lng": 2.328, "lb": {"ru": "REGARD XXV", "en": "REGARD XXV"}, "t": {"ru": "Regard XXV — Колодец Ла Рошфуко", "en": "Regard XXV — The La Rochefoucauld Well"}, "s": {"ru": "Av. du Gal Leclerc · Сад больницы La Rochefoucauld", "en": "Av. du Gal Leclerc · Garden of the La Rochefoucauld hospital"}, "h": {"ru": "<p>Оригинальный сохранившийся смотровой колодец XXV Акведука Медичи, спрятанный в саду бывшей больницы Ла Рошфуко (построенной при Людовике XVI). Маленькое каменное здание в стиле античного храма открывает лестницу вниз, в 100-метровый участок галереи акведука. Один из немногих оригинальных regards XVII века, доживших до наших дней.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/puits-rochefoucauld.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The original, surviving inspection well XXV of the Medici Aqueduct, hidden in the garden of the former La Rochefoucauld hospital (built under Louis XVI). A small stone building in the style of an antique temple opens onto a staircase leading down into a 100-metre stretch of the aqueduct gallery. One of the few original 17th-century regards to have survived to our day.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/puits-rochefoucauld.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-seine-cuvier", "lat": 48.844, "lng": 2.357, "lb": {"ru": "JARDIN DES PLANTES", "en": "JARDIN DES PLANTES"}, "t": {"ru": "Под Ботаническим садом", "en": "Beneath the Botanical Garden"}, "s": {"ru": "Rue Cuvier, 5-й округ · Jardin des plantes", "en": "Rue Cuvier, 5th arr. · Jardin des plantes"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-seine-cuvier.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-seine-cuvier.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "tombe-chirac", "lat": 48.838, "lng": 2.3263, "lb": {"ru": "МОГИЛА ШИРАКА", "en": "CHIRAC’S GRAVE"}, "t": {"ru": "Могила Жака Ширака", "en": "The Grave of Jacques Chirac"}, "s": {"ru": "Кладбище Монпарнас, дивизион 1 · Единственный президент V Республики, похороненный в Париже", "en": "Montparnasse Cemetery, division 1 · The only president of the Fifth Republic buried in Paris"}, "h": {"ru": "<p>Жак Ширак (1932–2019) — президент Франции 1995–2007, мэр Парижа 1977–1995. Простая стела из белого мрамора с крестом, без украшений. Рядом похоронена его старшая дочь Лоранс (1958–2016). Единственный президент Пятой республики, похороненный в Париже.</p><div class=\"p-sc\">Яблоки на могиле</div><p>Посетители регулярно оставляют на могиле яблоки — отсылка к сатирической телепередаче «Les Guignols de l’info», где кукла Ширака постоянно грызла яблоко. Странный случай: самая торжественная государственная символика пересекается с кукольным юмором 1990-х.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/tombe-chirac.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Jacques Chirac (1932–2019) — President of France 1995–2007, Mayor of Paris 1977–1995. A simple white marble stele with a cross, with no ornament. His elder daughter Laurence (1958–2016) is buried beside him. The only president of the Fifth Republic buried in Paris.</p><div class='p-sc'>Apples on the grave</div><p>Visitors regularly leave apples on the grave — a reference to the satirical TV show «Les Guignols de l’info», where the Chirac puppet was forever munching an apple. A strange case: the most solemn state symbolism crossing with the puppet humour of the 1990s.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/tombe-chirac.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "angle-hopital-dumeril", "lat": 48.838, "lng": 2.358, "lb": {"ru": "HÔPITAL / DUMÉRIL", "en": "HÔPITAL / DUMÉRIL"}, "t": {"ru": "Угол Bld de l’Hôpital и rue Duméril", "en": "Corner of Bld de l’Hôpital and Rue Duméril"}, "s": {"ru": "13-й округ", "en": "13th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/angle-hopital-dumeril.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/angle-hopital-dumeril.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "voie-verte", "lat": 48.824, "lng": 2.331, "lb": {"ru": "ВУА ВЕРТ", "en": "VOIE VERTE"}, "t": {"ru": "Зелёный путь", "en": "The Green Way"}, "s": {"ru": "Rue du Père Corentin, 14-й округ · La Voie Verte", "en": "Rue du Père-Corentin, 14th arr. · La Voie Verte"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/voie-verte.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/voie-verte.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "sous-vaugirard", "lat": 48.844, "lng": 2.318, "lb": {"ru": "ПОД VAUGIRARD", "en": "BENEATH VAUGIRARD"}, "t": {"ru": "Под улицей Вожирар", "en": "Beneath Rue de Vaugirard"}, "s": {"ru": "6-й / 15-й округ · Самая длинная улица Парижа", "en": "6th / 15th arr. · The longest street in Paris"}, "h": {"ru": "<p>Rue de Vaugirard — самая длинная улица Парижа, 4,36 км. Пересекает несколько кварталов и проходит над участками каменоломен. Названа в честь деревни Вожирар, поглощённой Парижем в 1860 году.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/sous-vaugirard.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Rue de Vaugirard is the longest street in Paris, 4.36 km. It crosses several districts and runs over sections of the quarries. It is named after the village of Vaugirard, absorbed by Paris in 1860.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/sous-vaugirard.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "sous-passy", "lat": 48.857, "lng": 2.283, "lb": {"ru": "ПОД ПАССИ", "en": "BENEATH PASSY"}, "t": {"ru": "Под благородными кварталами", "en": "Beneath the well-to-do quarters"}, "s": {"ru": "Rue de Passy, 16-й округ", "en": "Rue de Passy, 16th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/sous-passy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/sous-passy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-st-jacques", "lat": 48.846, "lng": 2.344, "lb": {"ru": "RUE ST-JACQUES", "en": "RUE ST-JACQUES"}, "t": {"ru": "Под улицей Сен-Жак", "en": "Beneath Rue Saint-Jacques"}, "s": {"ru": "5-й округ · Римская Via Superior", "en": "5th arr. · The Roman Via Superior"}, "h": {"ru": "<p>Rue Saint-Jacques — одна из древнейших улиц Парижа, идущая ровно по линии римской Via Superior (в отличие от Rue d’Enfer, бывшей Via Inferior). Путь паломников к Сантьяго-де-Компостела начинался именно отсюда — оттого и название. Под улицей — галереи каменоломен с табличками IGC.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-st-jacques.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Rue Saint-Jacques is one of the oldest streets in Paris, running exactly along the line of the Roman Via Superior (unlike Rue d’Enfer, the former Via Inferior). The pilgrims’ road to Santiago de Compostela began right here — hence the name. Beneath the street are quarry galleries with IGC plaques.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-st-jacques.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "en-route-bain", "lat": 48.823, "lng": 2.34, "lb": {"ru": "ПО ДОРОГЕ К ВАННЕ", "en": "ON THE WAY TO THE BATH"}, "t": { var labelMarkers=[];
function makeLabelIcon(p){return L.divIcon({className:'cl',html:p.lb[LANG],iconSize:[130,14],iconAnchor:[-10,8]});}
P.forEach(function(p){
  var ic=L.divIcon({className:'',html:'<div class="cm"></div>',iconSize:[12,12],iconAnchor:[6,6]});
  var m=L.marker([p.lat,p.lng],{icon:ic}).addTo(map);
  m.on('click',function(){op(p)});
  // Label
  var lm=L.marker([p.lat,p.lng],{icon:makeLabelIcon(p),interactive:false}).addTo(map);
  labelMarkers.push({m:lm,p:p});
});
function renderLabels(){labelMarkers.forEach(function(o){o.m.setIcon(makeLabelIcon(o.p));});}
// Hide overlapping labels so they stay readable. Locations with text win;
// bare point-markers yield their label (the clickable dot stays). Re-runs on zoom/pan.
function declutter(){
  if(!labelMarkers.length) return;
  labelMarkers.forEach(function(o){ if(o.m._icon) o.m._icon.style.display=''; });
  var size=map.getSize(), placed=[];
  var order=labelMarkers.map(function(o,i){return {o:o,i:i,pr:(/<p>/.test(o.p.h.ru)?0:1)};})
                        .sort(function(a,b){return a.pr-b.pr || a.i-b.i;});
  order.forEach(function(e){
    var el=e.o.m._icon; if(!el) return;
    var pt=map.latLngToContainerPoint([e.o.p.lat,e.o.p.lng]);
    var w=el.offsetWidth || (String(e.o.p.lb[LANG]).length*7+10);
    var h=el.offsetHeight || 14;
    var x1=pt.x+10, y1=pt.y-8, x2=x1+w, y2=y1+h;
    var onScreen=(x2>=-30 && x1<=size.x+30 && y2>=-30 && y1<=size.y+30);
    var hit=false;
    for(var k=0;k<placed.length;k++){var r=placed[k];
      if(!(x2+3<r.x1||x1-3>r.x2||y2+3<r.y1||y1-3>r.y2)){hit=true;break;}}
    if(hit){ el.style.display='none'; }
    else { el.style.display=''; if(onScreen) placed.push({x1:x1,y1:y1,x2:x2,y2:y2}); }
  });
}
map.on('zoomend moveend', declutter);

// ===== AUDIO — MP3 FROM GITHUB =====
var AUDIO_BASE = 'https://raw.githubusercontent.com/aleleosedova/surprise/main/audio/';
var audioEl = null;
var audioPlaying = false;
var currentLocId = null;
var audioSpeedIdx = 0;
var audioSpeeds = [1.0, 1.25, 1.5, 0.75];
var progressInterval = null;

function stopAudio() {
  if (audioEl) {
    audioEl.pause();
    audioEl.currentTime = 0;
    audioEl.src = '';
  }
  audioPlaying = false;
  currentLocId = null;
  if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
  var btn = document.getElementById('au-btn');
  if (btn) { btn.innerHTML = '&#9654;'; btn.classList.remove('playing'); }
  var bar = document.getElementById('audio-progress');
  if (bar) bar.style.width = '0%';
  // Remove paragraph highlights
  document.querySelectorAll('.p-bd p.audio-active').forEach(function(el) {
    el.classList.remove('audio-active');
  });
}

function updateAudioProgress() {
  if (!audioEl || !audioEl.duration) return;
  var pct = (audioEl.currentTime / audioEl.duration) * 100;
  var bar = document.getElementById('audio-progress');
  if (bar) bar.style.width = pct + '%';
  
  // Highlight paragraph based on time position
  var paragraphs = document.querySelectorAll('.p-bd p');
  if (paragraphs.length === 0) return;
  var fraction = audioEl.currentTime / audioEl.duration;
  var idx = Math.floor(fraction * paragraphs.length);
  idx = Math.min(idx, paragraphs.length - 1);
  
  paragraphs.forEach(function(p) { p.classList.remove('audio-active'); });
  if (paragraphs[idx]) {
    paragraphs[idx].classList.add('audio-active');
  }
}

function cycleSpeed() {
  audioSpeedIdx = (audioSpeedIdx + 1) % audioSpeeds.length;
  var btn = document.getElementById('speed-btn');
  if (btn) btn.textContent = audioSpeeds[audioSpeedIdx] + '\u00d7';
  if (audioEl) audioEl.playbackRate = audioSpeeds[audioSpeedIdx];
}

function toggleAudio() {
  // If playing — stop
  if (audioPlaying) { stopAudio(); return; }
  
  // Get current location id directly from panel data attribute
  var locId = document.getElementById('pn').dataset.locId;
  if (!locId) return;
  
  var url = AUDIO_BASE + locId + '.mp3';
  
  if (!audioEl) {
    audioEl = new Audio();
  }
  
  audioEl.src = url;
  audioEl.playbackRate = audioSpeeds[audioSpeedIdx];
  audioEl.volume = 1.0;
  
  audioEl.onended = function() { stopAudio(); };
  audioEl.onerror = function(e) {
    console.log('Audio error for ' + locId + ':', e);
    stopAudio();
  };
  
  audioEl.play().then(function() {
    audioPlaying = true;
    currentLocId = locId;
    var btn = document.getElementById('au-btn');
    btn.innerHTML = '&#9724;';
    btn.classList.add('playing');
    // Start progress tracking
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(updateAudioProgress, 200);
  }).catch(function(err) {
    console.log('Audio play error:', err);
    stopAudio();
  });
}

// Fallback: use browser speechSynthesis if MP3 missing
function fallbackSpeech() {
  var synth = window.speechSynthesis;
  var title = document.getElementById('pt').textContent || '';
  var el = document.getElementById('pb');
  if (!el) return;
  var text = title + '. ' + (el.innerText || '');
  text = text.replace(/[\ud83d\udcf7]/g, '').replace(/PLACEHOLDER[^\n]*/g, '').trim();
  
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ru-RU';
  utter.rate = 0.82;
  utter.onend = function() { stopAudio(); };
  
  audioPlaying = true;
  var btn = document.getElementById('au-btn');
  btn.innerHTML = '&#9724;';
  btn.classList.add('playing');
  synth.speak(utter);
}

  {yru:'1944', yen:'1944', ru:'роль-танги командует освобождением парижа', en:'rol-tanguy commands the liberation of paris'},
  {yru:'2004', yen:'2004', ru:'обнаружен подпольный кинотеатр', en:'underground cinema discovered'}
];

function renderTimeline(){
  var t=document.getElementById('tl-title'); if(t)t.textContent=UI[LANG].tlTitle;
  var box=document.getElementById('tl-entries'); if(!box)return;
  var h='';
  TL.forEach(function(e){
    h+='<div class="te"><span class="ty">'+(LANG==='en'?e.yen:e.yru)+'</span><span class="tv">'+(LANG==='en'?e.en:e.ru)+'</span></div>';
  });
  box.innerHTML=h;
}

function applyLang(){
  document.documentElement.lang=LANG;
  var el;
  if(el=document.getElementById('main-title'))el.textContent=UI[LANG].title;
  if(el=document.getElementById('main-sub'))el.textContent=UI[LANG].sub;
  if(el=document.getElementById('idx-btn'))el.textContent=UI[LANG].idx;
  document.querySelectorAll('.lang-opt').forEach(function(o){o.classList.toggle('active', o.getAttribute('data-lang')===LANG);});
  if(el=document.getElementById('speed-btn'))el.title=UI[LANG].speed;
  if(el=document.getElementById('au-btn'))el.title=UI[LANG].play;
  renderTimeline();
  renderLabels();
  declutter();
  buildIdx();
  positionLangToggle();
  if(currentP && document.getElementById('pn').classList.contains('on')) op(currentP);
}

function setLang(l){
  LANG=l;
  try{localStorage.setItem('catacombs_lang',LANG);}catch(e){}
  applyLang();
}

function positionLangToggle(){
  var lt=document.getElementById('lang-toggle'), idx=document.getElementById('idx-btn');
  if(!lt||!idx) return;
  if(window.matchMedia('(max-width: 768px)').matches){ lt.style.right=''; return; }
  var r=idx.getBoundingClientRect();
  lt.style.right=(window.innerWidth - r.left + 44)+'px';  // ~half-toggle gap, separate boxes
}
window.addEventListener('resize', positionLangToggle);

applyLang();

</script>
</body>
</html>
