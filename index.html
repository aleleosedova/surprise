c=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-52.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-53.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-54.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-55.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-56.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Every year, graduates of the Paris School of Mines (École des Mines, founded 1783) descend underground and paint a mural for their class. The tradition has run for more than a century — the walls are covered in dozens of works, from the naïve to the virtuosic.</p><div class='p-sc'>Institutional graffiti</div><p>The only place in the catacombs where «graffiti» is not vandalism but an academic tradition. Each mural is signed with the year and the graduates’ names. Some students carried litres of paint through kilometres of tunnels for a few hours of painting.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent om/aleleosedova/surprise/main/images/galerie-promos-50.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-51.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-52.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-53.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-54.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-55.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-56.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "mur-fraudes", "lat": 48.829, "lng": 2.336, "lb": {"ru": "СТЕНА МОШЕННИКОВ", "en": "WALL OF SMUGGLERS"}, "t": {"ru": "Стена Мошенников — Подземная таможня", "en": "The Wall of Smugglers — An underground customs post"}, "s": {"ru": "Mur des Fraudes · Городская стена уходит под землю", "en": "Mur des Fraudes · The city wall goes underground"}, "h": {"ru": "<p>В XVIII веке Париж окружала Стена Откупщиков — таможенная граница для взимания налогов на товары. Контрабандисты быстро сообразили, что можно обойти стену через каменоломни. Власти ответили: построили подземную стену тоже. На подземных постах стояли охранники.</p><div class=\"p-sc\">Каменная граница</div><p>Остатки стены видны до сих пор: толстая каменная кладка с арочным проходом. Редкий случай, когда бюрократическая граница буквально продолжалась под землёй. Катафилы называют её ориентиром — «за стеной мошенников поверни налево».</p>", "en": "<p>In the 18th century Paris was ringed by the Wall of the Farmers-General — a customs boundary for collecting taxes on goods. Smugglers quickly realised they could get around the wall through the quarries. The authorities responded: they built an underground wall too. Guards were posted at the underground checkpoints.</p><div class='p-sc'>A border in stone</div><p>Remnants of the wall are still visible: thick stonework with an arched passage. A rare case of a bureaucratic border literally continuing underground. Cataphiles use it as a landmark — «turn left past the smugglers’ wall».</p>"}}, {"id": "fontaine-chartreux", "lat": 48.825, "lng": 2.325, "lb": {"ru": "ФОНТАН ШАРТРЁЗ", "en": "CHARTREUX FOUNTAIN"}, "t": {"ru": "Фонтан Шартрёз — Подземный источник", "en": "The Chartreux Fountain — An underground spring"}, "s": {"ru": "Fontaine des Chartreux · Монахи и ликёр · Вода течёт до сих пор", "en": "Fontaine des Chartreux · Monks and liqueur · The water still flows"}, "h": {"ru": "<p>Подземный источник, названный в честь монахов-картузианцев, чей монастырь стоял наверху. Вода течёт до сих пор — холодная, прозрачная, из водоносного слоя под лютецианским известняком.</p><div class=\"p-sc\">Ликёр Филибера</div><p>Картузианцы хранили в подземельях знаменитый ликёр шартрёз. По самой романтичной версии, именно за бутылкой этого ликёра Филибер Аспар спустился в катакомбы ноябрьской ночью 1793 года. Свеча погасла. Ликёр остался ненайденным.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontaine-chartreux.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>An underground spring named after the Carthusian monks whose monastery stood above. The water still flows — cold and clear, from the aquifer beneath the Lutetian limestone.</p><div class='p-sc'>Philibert’s liqueur</div><p>The Carthusians stored their famous Chartreuse liqueur in the cellars below. By the most romantic version, it was for a bottle of this liqueur that Philibert Aspairt descended into the catacombs one November night in 1793. The candle went out. The liqueur was never found.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontaine-chartreux.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cellier", "lat": 48.826, "lng": 2.338, "lb": {"ru": "ЛЁ СЕЛЬЕ", "en": "LE CELLIER"}, "t": {"ru": "Лё Селье — Подвалы пивоварни", "en": "Le Cellier — The brewery cellars"}, "s": {"ru": "Le Cellier · Пивоварня Dumesnil · Миллион гектолитров", "en": "Le Cellier · The Dumesnil brewery · A million hectolitres"}, "h": {"ru": "<p>В конце XIX века подземные пивоварни 14-го округа производили больше миллиона гектолитров пива в год — постоянные 14°C были идеальны для брожения задолго до изобретения холодильников. Dumesnil — последняя из них, работала до конца 1960-х.</p><div class=\"p-sc\">Откуда на «Пляже» песок</div><p>Когда Dumesnil закрылась, песок из фильтрационных систем остался в галереях. Катафилы превратили его в пол легендарного зала «Ля Пляж» — так пивоварня XIX века стала клубной площадкой XX.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>In the late 19th century the underground breweries of the 14th arrondissement produced more than a million hectolitres of beer a year — the constant 14°C was ideal for fermentation long before refrigeration existed. Dumesnil was the last of them, operating until the late 1960s.</p><div class='p-sc'>Where the sand on «La Plage» comes from</div><p>When Dumesnil closed, the sand from its filtration systems was left behind in the galleries. Cataphiles turned it into the floor of the legendary hall «La Plage» — so a 19th-century brewery became a 20th-century party venue.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cellier-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-assas", "lat": 48.846, "lng": 2.331, "lb": {"ru": "RUE D’ASSAS", "en": "RUE D’ASSAS"}, "t": {"ru": "Под улицей д’Ассас", "en": "Beneath Rue d’Assas"}, "s": {"ru": "6-й округ · Буквально над катакомбами · 10 лет бурения", "en": "6th arr. · Literally above the catacombs · 10 years of drilling"}, "h": {"ru": "<p>Каменные таблички IGC на потолках галерей внизу выведены чётким почерком XVIII века: «Rue d’Assas». Напоминание о том, что жители Левого берега ходят по тонкому слою земли над 300 км пустот.</p><div class=\"p-sc\">Десять лет</div><p>По данным карты CUBE, на укрепление только участка под улицей д’Ассас ушло десять лет — настолько разветвлённой и аварийной была подземная структура. Каждый столб, каждая инъекция бетона — борьба за то, чтобы город наверху не провалился в город внизу.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-assas.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-assas-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The IGC’s stone plaques on the gallery ceilings below are lettered in a clear 18th-century hand: «Rue d’Assas». A reminder that the people of the Left Bank walk on a thin crust of earth above 300 km of voids.</p><div class='p-sc'>Ten years</div><p>According to the CUBE map, reinforcing the section beneath Rue d’Assas alone took ten years — that is how branching and unstable the underground structure was. Every pillar, every injection of concrete was a fight to keep the city above from collapsing into the city below.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-assas.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-assas-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "musee-liberation", "lat": 48.8341, "lng": 2.3322, "lb": {"ru": "МУЗЕЙ ОСВОБОЖДЕНИЯ", "en": "LIBERATION MUSEUM"}, "t": {"ru": "Музей Освобождения Парижа", "en": "The Liberation of Paris Museum"}, "s": {"ru": "Place Denfert-Rochereau · Открыт 2019 · Бункер Роль-Танги", "en": "Place Denfert-Rochereau · Opened 2019 · Rol-Tanguy’s bunker"}, "h": {"ru": "<p>Открыт 25 августа 2019 года — ровно в 75-ю годовщину освобождения Парижа. Над историческим бункером полковника Роль-Танги. Можно спуститься в подлинный командный пункт, откуда координировалось восстание августа 1944.</p><div class=\"p-sc\">Что внутри</div><p>Оригинальные карты операций, телефонное оборудование, личные вещи бойцов. Надписи на стенах. Ощущение, что только что вышли люди — а прошло 80 лет.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/museum-liberation.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Opened on 25 August 2019 — exactly the 75th anniversary of the liberation of Paris. It sits above Colonel Rol-Tanguy’s historic bunker. You can go down into the genuine command post from which the uprising of August 1944 was coordinated.</p><div class='p-sc'>What’s inside</div><p>Original operations maps, telephone equipment, the fighters’ personal belongings. Inscriptions on the walls. It feels as if the people just stepped out — though 80 years have passed.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/museum-liberation.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "place-italie", "lat": 48.831, "lng": 2.356, "lb": {"ru": "СЕТЬ 13-ГО ОКР.", "en": "13TH ARR. NETWORK"}, "t": {"ru": "Каменоломни 13-го округа", "en": "Quarries of the 13th arrondissement"}, "s": {"ru": "Place d’Italie · Отдельная сеть · НЕ соединена с GRS", "en": "Place d’Italie · A separate network · NOT linked to the GRS"}, "h": {"ru": "<p>Важная деталь, которую многие не понимают: подземный Париж — это не один лабиринт, а несколько изолированных систем. Под площадью Италии — отдельная сеть, физически не соединённая с Большой Южной Сетью. Между ними — метро, канализация и слои породы.</p><div class=\"p-sc\">Petite Ceinture</div><p>Заброшенная кольцевая железная дорога (1852–1934) пересекает несколько подземных пространств. Катафилы используют её тоннели как входы — рельсы уходят прямо в каменоломни. Полиция регулярно заваривает люки, катафилы регулярно их вскрывают.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>An important detail many people miss: underground Paris is not one labyrinth but several isolated systems. Beneath Place d’Italie is a separate network, physically unconnected to the Great Southern Network. Between them lie the métro, the sewers and layers of rock.</p><div class='p-sc'>Petite Ceinture</div><p>The abandoned ring railway (1852–1934) crosses several underground spaces. Cataphiles use its tunnels as entrances — the rails run straight into the quarries. The police regularly weld the manholes shut; the cataphiles regularly cut them open again.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/place-italie-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "champignons", "lat": 48.836, "lng": 2.34, "lb": {"ru": "ШАМПИНЬОНЫ", "en": "MUSHROOMS"}, "t": {"ru": "Парижские шампиньоны", "en": "The Paris mushrooms"}, "s": {"ru": "Champignons de Paris · Грибоводство под городом · с 1814", "en": "Champignons de Paris · Mushroom-growing under the city · since 1814"}, "h": {"ru": "<p>В 1814 году садовник Шамбри с улицы Санте обнаружил в заброшенной каменоломне под своим огородом роскошные шампиньоны — конский навоз, просочившийся через колодец, создал идеальную среду. Он бросил огород и ушёл под землю. Так родились «champignons de Paris» — парижские грибы.</p><div class=\"p-sc\">Подземная индустрия</div><p>К концу XIX века подземное грибоводство стало индустрией. Километры галерей были заняты грядками. Постоянная температура 14°C и высокая влажность — идеальный инкубатор. Производство переехало в Луару только в XX веке, но название «парижские» осталось навсегда.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/champignons.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/champignons-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>In 1814 a gardener named Chambry, from Rue de la Santé, found lush mushrooms in an abandoned quarry beneath his vegetable plot — horse manure had seeped down through a well and created the perfect medium. He gave up the garden and went underground. So the «champignons de Paris» — Paris mushrooms — were born.</p><div class='p-sc'>An underground industry</div><p>By the end of the 19th century underground mushroom-growing had become an industry. Kilometres of galleries were given over to beds. The constant 14°C and high humidity made a perfect incubator. Production only moved to the Loire in the 20th century, but the name «Parisian» stuck for good.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/champignons.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/champignons-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "concert-1897", "lat": 48.832, "lng": 2.336, "lb": {"ru": "КОНЦЕРТ 1897", "en": "CONCERT 1897"}, "t": {"ru": "Тайный концерт в катакомбах", "en": "The secret concert in the catacombs"}, "s": {"ru": "2 апреля 1897 · Парижская Опера · 45 музыкантов среди костей", "en": "2 April 1897 · Paris Opera · 45 musicians among the bones"}, "h": {"ru": "<p>2 апреля 1897 года около ста представителей парижского высшего света получили таинственные приглашения на 23:00 — без указания места. Их провели под землю, где 45 музыкантов Парижской Оперы исполнили Похоронный марш Шопена, Пляску смерти Сен-Санса и фрагменты Героической симфонии Бетховена.</p><div class=\"p-sc\">Среди костей до двух ночи</div><p>Концерт продолжался до 2 часов ночи. Газета Le Journal illustré опубликовала гравюру: дамы в вечерних платьях и мужчины во фраках среди стен из черепов. Двух рабочих каменоломен уволили за пособничество (по слухам, позже восстановили). Это был, возможно, самый странный концерт в истории Парижа.</p><p>Это место также памятно тем, что 19 апреля 2025 года Армо Баграмов также получил здесь <a href=\"https://www.instagram.com/reel/DVMJrXagNml/?utm_source=ig_web_copy_link&igsh=NTc4MTIwNjQ2YQ==\" target=\"_blank\" style=\"color:var(--accent-ink)\">приглашение на концерт</a>.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/concert-1897.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>On 2 April 1897 about a hundred members of Parisian high society received mysterious invitations for 11 p.m. — with no location given. They were led underground, where 45 musicians of the Paris Opera performed Chopin’s Funeral March, Saint-Saëns’ Danse macabre and excerpts from Beethoven’s Eroica.</p><div class='p-sc'>Among the bones until two in the morning</div><p>The concert went on until 2 a.m. The newspaper Le Journal illustré published an engraving: ladies in evening gowns and men in tailcoats among walls of skulls. Two quarry workers were dismissed for helping (rumour has it they were later reinstated). It was, perhaps, the strangest concert in the history of Paris.</p><p>This spot is also memorable because on 19 April 2025 Armo Bagramov likewise received <a href='https://www.instagram.com/reel/DVMJrXagNml/?utm_source=ig_web_copy_link&igsh=NTc4MTIwNjQ2YQ==' target='_blank' style='color:var(--accent-ink)'>an invitation to a concert</a> here.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/concert-1897.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "jellyfish", "lat": 48.822, "lng": 2.338, "lb": {"ru": "МЕДУЗА", "en": "JELLYFISH"}, "t": {"ru": "Медуза — Окаменевший источник", "en": "The Jellyfish — A petrifying spring"}, "s": {"ru": "The Jellyfish · «Petrifying spring» · Район Монсури", "en": "The Jellyfish · «Petrifying spring» · Montsouris area"}, "h": {"ru": "<p>Во влажных галереях Монсури можно увидеть странное природное образование — конкрецию, которую раньше называли «окаменевающим источником». Вода, насыщенная минералами, столетиями стекала по камню и создала форму, поразительно напоминающую медузу — с «щупальцами» из кальцита.</p><div class=\"p-sc\">Живая геология</div><p>Это не скульптура и не рукотворный объект — чистое творчество воды и времени. Конкреция продолжает расти: каждый год добавляется тонкий слой минералов. Через тысячу лет она будет ещё больше.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/jellyfish.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/jellyfish.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/meduze.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/meduse.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>In the damp galleries of Montsouris you can see a strange natural formation — a concretion once called a «petrifying spring». Water saturated with minerals trickled down the stone for centuries and built up a shape that looks remarkably like a jellyfish, with «tentacles» of calcite.</p><div class='p-sc'>Living geology</div><p>It is neither a sculpture nor a man-made object — pure work of water and time. The concretion is still growing: a thin layer of minerals is added every year. A thousand years from now it will be larger still.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/jellyfish.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/jellyfish.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/meduze.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/meduse.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "crypt", "lat": 48.819, "lng": 2.34, "lb": {"ru": "КРИПТА", "en": "THE CRYPT"}, "t": {"ru": "Крипта — Подземная роза", "en": "The Crypt — An underground rose"}, "s": {"ru": "La Crypte · Роза в камне · Работы Гандальфа и Ла Гаргуй", "en": "La Crypte · A rose in stone · Work of Gandalf and La Gargouille"}, "h": {"ru": "<p>Внизу красивой лестницы — маленькая галерея, в конце которой зал, знаменитый розой, вырезанной прямо в камне. Работы катафилов Гандальфа и Ла Гаргуй, созданные в 1993 году, частично разрушены вандалами в 1996-м, но сохраняют странное очарование руин внутри руин.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>At the foot of a fine staircase is a small gallery, and at its end a room famous for a rose carved straight into the stone. The work of the cataphiles Gandalf and La Gargouille, made in 1993 and partly destroyed by vandals in 1996, it keeps a strange charm — a ruin within a ruin.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/crypt-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "thrones", "lat": 48.8195, "lng": 2.34, "lb": {"ru": "ЗАЛ ТРОНОВ", "en": "ROOM OF THRONES"}, "t": {"ru": "Зал Тронов — Императорский зал", "en": "The Room of Thrones — The Imperial Hall"}, "s": {"ru": "Thrones Room · Каменные троны 1999 · Залит бетоном в 2000", "en": "Thrones Room · Stone thrones 1999 · Concreted over in 2000"}, "h": {"ru": "<p>Целиком выстроенный из каменных тронов — катафилы вырезали их из известняка в 1999 году. Одно из самых впечатляющих творений подземного искусства. В 2000 году IGC залила зал бетоном при укреплении галерей — типичная судьба катафильских работ.</p><div class=\"p-sc\">Каменный век против бетонного</div><p>Как написано на карте CUBE: «за полвека каменоломни перешли из каменного века в бетонный». Десятки залов и галерей были уничтожены инъекциями бетона ради безопасности города наверху.</p>", "en": "<p>Built entirely of stone thrones — cataphiles carved them out of the limestone in 1999. One of the most impressive creations of underground art. In 2000 the IGC filled the room with concrete while reinforcing the galleries — the typical fate of cataphile work.</p><div class='p-sc'>Stone age versus concrete age</div><p>As the CUBE map puts it: «in half a century the quarries went from the stone age to the concrete age». Dozens of rooms and galleries were destroyed by concrete injections for the safety of the city above.</p>"}}, {"id": "mansart", "lat": 48.84, "lng": 2.342, "lb": {"ru": "ЛЕСТНИЦА МАНСАРА", "en": "MANSART STAIRWAY"}, "t": {"ru": "Лестница Мансара", "en": "The Mansart Stairway"}, "s": {"ru": "Mansart Stairway · Под Валь-де-Грас · XVII в.", "en": "Mansart Stairway · Beneath Val-de-Grâce · 17th c."}, "h": {"ru": "<p>Работа архитектора Франсуа Мансара — прямая лестница (в отличие от типичных винтовых) под Валь-де-Грас. Перестроена Гийомо, первым инспектором IGC, который перевёл высотные отметки из футов в метры и установил красивую серию стрельчатых арок.</p><div class=\"p-sc\">Точка входа Филибера</div><p>Именно по этой лестнице, по одной из версий, Филибер Аспар спустился в катакомбы в ноябре 1793 года. Свеча погасла где-то в лабиринте Валь-де-Грас наверху.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/mansart.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The work of the architect François Mansart — a straight staircase (unlike the usual spiral ones) beneath Val-de-Grâce. It was rebuilt by Guillaumot, the first inspector of the IGC, who converted the elevation marks from feet into metres and installed a handsome series of pointed arches.</p><div class='p-sc'>Philibert’s point of entry</div><p>By one account it was down this very staircase that Philibert Aspairt descended into the catacombs in November 1793. His candle went out somewhere in the Val-de-Grâce labyrinth above.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/mansart.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cubes-room", "lat": 48.841, "lng": 2.338, "lb": {"ru": "ЗАЛ КУБОВ", "en": "ROOM OF CUBES"}, "t": {"ru": "Зал Кубов", "en": "The Room of Cubes"}, "s": {"ru": "Cubes Room · Фонтан из каменных блоков", "en": "Cubes Room · A fountain of stone blocks"}, "h": {"ru": "<p>Зал построен вокруг фонтана с каменной кромкой. Вокруг — серия огромных каменных блоков, оставленных каменотёсами. Их кубическая форма дала залу название. К фонтану ведёт маленькая лестница и колодец с лесенкой для измерения уровня грунтовых вод.</p><p><a href=\"https://www.catacombes.xyz/explore/cube\" target=\"_blank\" style=\"color:#b08d57\">➡ Смотреть в 3D на catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cubes-room.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The room is built around a fountain with a stone rim. Around it stands a series of huge stone blocks left behind by the quarrymen. Their cubic shape gave the room its name. A small staircase leads down to the fountain, with a ladder-equipped well for measuring the groundwater level.</p><p><a href='https://www.catacombes.xyz/explore/cube' target='_blank' style='color:#b08d57'>➡ View in 3D at catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cubes-room.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "swimming-pool", "lat": 48.836, "lng": 2.345, "lb": {"ru": "БАССЕЙН", "en": "THE POOL"}, "t": {"ru": "Подземный бассейн", "en": "The Underground Pool"}, "s": {"ru": "The Swimming Pool · Затопленная галерея · Район Порт-Рояль", "en": "The Swimming Pool · A flooded gallery · Port-Royal area"}, "h": {"ru": "<p>Затопленная галерея, которую катафилы прозвали «бассейном». Уровень воды следует за грунтовыми водами — иногда по колено, иногда по грудь. Отчаянные ныряльщики устраивают здесь подземный дайвинг с фонарями. Температура воды — те же 14°C, что и воздуха.</p>", "en": "<p>A flooded gallery that cataphiles nicknamed the «pool». The water level follows the groundwater — sometimes knee-deep, sometimes chest-deep. Reckless divers go underground diving here with torches. The water temperature is the same 14°C as the air.</p>"}}, {"id": "lions-pit", "lat": 48.836, "lng": 2.342, "lb": {"ru": "ЛЬВИНАЯ ЯМА", "en": "LIONS PIT"}, "t": {"ru": "Львиная яма", "en": "The Lions’ Pit"}, "s": {"ru": "Lions Pit · Старый открытый карьер · «Les Cibelles»", "en": "Lions Pit · An old open quarry · «Les Cibelles»"}, "h": {"ru": "<p>Древний открытый карьер, названный в честь цирковых представлений с хищниками, которые проходили поблизости. Эрикар де Тюри (Луи-Этьен Эрикар де Тюри, 1776–1854, директор Генеральной инспекции каменоломен с 1810 года, превративший оссуарий из свалки костей в музей) планировал использовать это место как монументальный вход в оссуарий — но план так и не был реализован.</p>", "en": "<p>An ancient open-cut quarry, named after the circus shows with wild animals that were held nearby. Héricart de Thury (Louis-Étienne Héricart de Thury, 1776–1854, director of the General Inspectorate of Quarries from 1810, who turned the ossuary from a dump of bones into a museum) planned to use this spot as a monumental entrance to the ossuary — but the plan was never carried out.</p>"}}, {"id": "flag-room", "lat": 48.837, "lng": 2.326, "lb": {"ru": "КОМНАТА ФЛАГА", "en": "FLAG ROOM"}, "t": {"ru": "Комната Флага", "en": "The Flag Room"}, "s": {"ru": "Flag Room · Salle du Drapeau · Убежище WWII", "en": "Flag Room · Salle du Drapeau · WWII shelter"}, "h": {"ru": "<p>Одно из убежищ гражданской обороны времён Второй мировой, расположенное в районе Монпарнас. Получило своё название, по легенде, от французского триколора, который хранили здесь в ожидании освобождения Парижа.</p>", "en": "<p>One of the civil-defence shelters of the Second World War, in the Montparnasse area. By legend it took its name from the French tricolour kept here while Paris waited to be liberated.</p>"}}, {"id": "ghost-room", "lat": 48.828, "lng": 2.34, "lb": {"ru": "ЗАЛ ПРИЗРАКОВ", "en": "ROOM OF GHOSTS"}, "t": {"ru": "Зал Призраков", "en": "The Room of Ghosts"}, "s": {"ru": "Ghost Room · Резные каменные фигуры", "en": "Ghost Room · Carved stone figures"}, "h": {"ru": "<p>Небольшой зал с каменными фигурами, вырезанными катафилами. В свете налобных фонарей силуэты отбрасывают на стены тени, похожие на призраков — отсюда название.</p>", "en": "<p>A small room with stone figures carved by cataphiles. In the light of headlamps the silhouettes throw shadows on the walls that look like ghosts — hence the name.</p>"}}, {"id": "flower-room", "lat": 48.826, "lng": 2.337, "lb": {"ru": "ЗАЛ ЦВЕТОВ", "en": "ROOM OF FLOWERS"}, "t": {"ru": "Зал Цветов", "en": "The Room of Flowers"}, "s": {"ru": "Flower Room · Salle des Fleurs", "en": "Flower Room · Salle des Fleurs"}, "h": {"ru": "<p>Зал, украшенный каменными цветами и растительными орнаментами, вырезанными прямо в стенах. Один из примеров того, как катафилы превращают грубые каменоломни в подземные сады.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/flower-room.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A room decorated with stone flowers and plant ornaments carved straight into the walls. One example of how cataphiles turn rough quarries into underground gardens.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/flower-room.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "lefebvre-shelter", "lat": 48.822, "lng": 2.317, "lb": {"ru": "УБЕЖИЩЕ ЛЕФЕВР", "en": "LEFEBVRE SHELTER"}, "t": {"ru": "Убежище Лефевр", "en": "The Lefebvre Shelter"}, "s": {"ru": "Lefebvre Shelter · Каменоломня с опорными столбами", "en": "Lefebvre Shelter · A quarry with support pillars"}, "h": {"ru": "<p>Старая каменоломня с сохранившимися опорными столбами (arm pillars), расположенная в юго-западной части сети. Использовалась как бомбоубежище. Рядом — «Церковь» (The Church), где сохранилась удивительная кладка, напоминающая фасад церкви Святого Антуана или Робера Куси.</p>", "en": "<p>An old quarry with surviving support pillars (arm pillars), in the south-west of the network. It was used as an air-raid shelter. Nearby is «The Church», where a remarkable piece of stonework survives, recalling the facade of the church of Saint-Antoine or of Robert de Coucy.</p>"}}, {"id": "concini", "lat": 48.849, "lng": 2.334, "lb": {"ru": "СЕТЬ КОНЧИНИ", "en": "CONCINI NETWORK"}, "t": {"ru": "Сеть Кончини", "en": "The Concini Network"}, "s": {"ru": "Concini Network · 6-й округ · Отель Кончини 1617", "en": "Concini Network · 6th arr. · Concini’s hôtel, 1617"}, "h": {"ru": "<p>Небольшая сеть тоннелей, названная в честь Кончино Кончини — итальянского фаворита Марии Медичи, убитого в 1617 году. Сеть проходит под его бывшим отелем. Галереи частично обрушены — работы на поверхности над ними ведутся осторожно.</p>", "en": "<p>A small network of tunnels named after Concino Concini — the Italian favourite of Marie de’ Medici, killed in 1617. The network runs beneath his former hôtel. The galleries are partly collapsed — surface work above them is carried out with care.</p>"}}, {"id": "old-carthusian", "lat": 48.845, "lng": 2.337, "lb": {"ru": "КАРТУЗИАНСКИЕ КАМЕНОЛОМНИ", "en": "CARTHUSIAN QUARRY"}, "t": {"ru": "Каменоломня старого картузианского монастыря", "en": "Quarry of the old Carthusian monastery"}, "s": {"ru": "Old Carthusian Monks Quarry · Люксембург · С XII века", "en": "Old Carthusian Monks Quarry · Luxembourg · Since the 12th century"}, "h": {"ru": "<p>Одна из трёх каменоломен, управлявшихся картузианскими монахами с XII века. Монахи построили свой великолепный монастырь буквально из камня, добытого у себя под ногами. Религиозный орден и его имущество были уничтожены во время Революции (1790–1793), но подземные галереи пережили и монархию, и республику.</p>", "en": "<p>One of three quarries run by the Carthusian monks from the 12th century. The monks built their magnificent monastery literally out of the stone quarried beneath their feet. The order and its property were destroyed during the Revolution (1790–1793), but the underground galleries outlived both the monarchy and the republic.</p>"}}, {"id": "anxiety-gallery", "lat": 48.831, "lng": 2.326, "lb": {"ru": "ГАЛЕРЕЯ ТРЕВОГИ", "en": "GALLERY OF ANXIETY"}, "t": {"ru": "Галерея Тревоги", "en": "The Gallery of Anxiety"}, "s": {"ru": "Anxiety Gallery · Galerie de l’Angoisse · Тошнота и мрак", "en": "Anxiety Gallery · Galerie de l’Angoisse · Nausea and gloom"}, "h": {"ru": "<p>Узкая, давящая галерея с особенно низким потолком и неприятной атмосферой — отсюда название. Даже опытные катафилы признают, что в определённых участках сети возникает необъяснимое чувство тревоги. Наука списывает это на недостаток кислорода и давление породы, но подземный фольклор предпочитает более мистические объяснения.</p>", "en": "<p>A narrow, oppressive gallery with an especially low ceiling and an unpleasant atmosphere — hence the name. Even experienced cataphiles admit that in certain stretches of the network an inexplicable feeling of anxiety comes over them. Science puts it down to a lack of oxygen and the pressure of the rock, but underground folklore prefers more mystical explanations.</p>"}}, {"id": "mirror-room", "lat": 48.83, "lng": 2.332, "lb": {"ru": "САЛОН ЗЕРКАЛ", "en": "HALL OF MIRRORS"}, "t": {"ru": "Салон Зеркал", "en": "The Hall of Mirrors"}, "s": {"ru": "Salon des Miroirs · Подземный диско-шар", "en": "Salon des Miroirs · An underground disco ball"}, "h": {"ru": "<p>Стены этого зала покрыты мозаикой из осколков зеркал — тысячи кусочков, наклеенных катафилами. При свете фонаря комната вспыхивает, как гигантский диско-шар. Это, наверное, самое фотогеничное место во всей нелегальной сети — полная противоположность мрачным тоннелям вокруг.</p><div class=\"p-sc\">Зачем</div><p>Катафилы говорят: «мы не убегаем от света — мы приносим его с собой». Зеркальный зал — буквальное воплощение этой идеи. Каждый посетитель отражается в тысяче осколков, и тоннель на секунду перестаёт быть тёмным.</p>", "en": "<p>The walls of this room are covered in a mosaic of broken mirror — thousands of fragments glued on by cataphiles. In torchlight the room flares up like a giant disco ball. It is probably the most photogenic place in the whole illegal network — the exact opposite of the gloomy tunnels around it.</p><div class='p-sc'>Why</div><p>The cataphiles say: «we don’t run from the light — we bring it with us». The Hall of Mirrors is that idea made literal. Every visitor is reflected in a thousand fragments, and for a second the tunnel stops being dark.</p>"}}, {"id": "observatory", "lat": 48.836, "lng": 2.337, "lb": {"ru": "ОБСЕРВАТОРИЯ", "en": "THE OBSERVATORY"}, "t": {"ru": "Под Парижской обсерваторией", "en": "Beneath the Paris Observatory"}, "s": {"ru": "1672 · Вторая постройка над пустотой · После Валь-де-Грас", "en": "1672 · The second building over the void · After Val-de-Grâce"}, "h": {"ru": "<p>Парижская обсерватория (1672) — второе крупное здание, обнаружившее под собой бездну. Как и Валь-де-Грас, большая часть бюджета ушла на аварийные фундаменты. Ирония: астрономы смотрели в небо, стоя на тонкой корке над 300 км пустот. Обсерватория до сих пор работает — старейшая в мире непрерывно действующая.</p><div class=\"p-sc\">Парижский меридиан</div><p>Обсерватория построена точно на линии Парижского меридиана — невидимой линии, которая почти 200 лет была конкурентом Гринвича за звание нулевого меридиана мира. Проиграла в голосовании 1884 года. Все расстояния на IGC-табличках в катакомбах отсчитываются от нулевой точки — лестницы Обсерватории на этой линии. В 1994 году художник Ян Диббетс установил 135 бронзовых медальонов «Arago» прямо в мостовой Парижа по линии меридиана — невидимый памятник невидимой линии. Часть медальонов с тех пор украдены или заасфальтированы.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/observatory.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The Paris Observatory (1672) was the second major building to discover an abyss beneath it. As with Val-de-Grâce, most of the budget went on emergency foundations. The irony: the astronomers gazed at the sky while standing on a thin crust above 300 km of voids. The Observatory is still working — the oldest continuously operating one in the world.</p><div class='p-sc'>The Paris meridian</div><p>The Observatory was built exactly on the line of the Paris meridian — the invisible line that for almost 200 years competed with Greenwich for the title of the world’s prime meridian. It lost in the vote of 1884. All distances on the IGC plaques in the catacombs are measured from a zero point — the Observatory staircase on this line. In 1994 the artist Jan Dibbets set 135 bronze «Arago» medallions into the pavement of Paris along the meridian — an invisible monument to an invisible line. Some of the medallions have since been stolen or paved over.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/observatory.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "fontis-gallery", "lat": 48.833, "lng": 2.334, "lb": {"ru": "ФОНТИС", "en": "FONTIS"}, "t": {"ru": "Фонтис — Колоколообразные провалы", "en": "Fontis — Bell-shaped sinkholes"}, "s": {"ru": "Fontis · ~7 обвалов в год · 11 м геологических слоёв", "en": "Fontis · ~7 collapses a year · 11 m of geological layers"}, "h": {"ru": "<p>«Фонтис» — колоколообразный провал, когда трещина в породе растёт вверх, пока не достигает поверхности. Представьте: в толще камня медленно формируется пустота в форме колокола. Когда она прорывается наружу — дом, улица, сквер проваливаются в одно мгновение. Именно так выглядела «Пасть Ада» в 1774 году.</p><div class=\"p-sc\">~100 отметок</div><p>В сети около 100 надписей, маркирующих отремонтированные фонтис. В галерее у выхода из оссуария три фонтис глубиной более 10 метров — геологические слои раскрашены разными цветами, кладка укрепления поднимается на 11 метров. Катастрофа в Кламаре (1961) — 23 разрушенных здания, 21 погибший — доказала, что опасность не в прошлом. ~7 обвалов в год до сих пор.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontis-gallery.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontis-gallery-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A «fontis» is a bell-shaped collapse: a crack in the rock grows upward until it reaches the surface. Picture it: deep in the stone a cavity slowly forms in the shape of a bell. When it breaks through, a house, a street, a square caves in all at once. That is exactly what the «Mouth of Hell» looked like in 1774.</p><div class='p-sc'>~100 marks</div><p>There are about 100 inscriptions in the network marking repaired fontis. In the gallery by the exit from the ossuary there are three fontis more than 10 metres deep — the geological layers are painted in different colours, and the reinforcing masonry rises 11 metres. The Clamart disaster (1961) — 23 buildings destroyed, 21 dead — proved the danger is not in the past. ~7 collapses a year, still today.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontis-gallery.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/fontis-gallery-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "white-hand", "lat": 48.831, "lng": 2.339, "lb": {"ru": "БЕЛАЯ РУКА", "en": "THE WHITE HAND"}, "t": {"ru": "Белая рука", "en": "The White Hand"}, "s": {"ru": "Main Blanche · Загадочный отпечаток", "en": "Main Blanche · A mysterious print"}, "h": {"ru": "<p>Белый отпечаток ладони на стене галереи в зоне Араго — один из самых узнаваемых ориентиров нелегальной части сети. Зона Араго — лабиринт коротких пересекающихся галерей, где легко заблудиться. Катафилы используют Main Blanche как навигационный маркер: от неё отсчитывают повороты к Салону зеркал и Стене мошенников.</p>", "en": "<p>A white handprint on a gallery wall in the Arago zone — one of the most recognisable landmarks in the illegal part of the network. The Arago zone is a maze of short, crossing galleries where it is easy to get lost. Cataphiles use the Main Blanche as a navigation marker: from it they count their turns to the Hall of Mirrors and the Wall of Smugglers.</p>"}}, {"id": "zlard-room", "lat": 48.834, "lng": 2.339, "lb": {"ru": "ЗАЛ ЗЛАР", "en": "ROOM ZLARD"}, "t": {"ru": "Зал Злар (Зал Трёх Лазов)", "en": "The Zlard Room (Room of the Three Crawlways)"}, "s": {"ru": "Zlard Room · Salle des Trois Chatières · 1999", "en": "Zlard Room · Salle des Trois Chatières · 1999"}, "h": {"ru": "<p>В 1999 году IGC начала инъекцию жидкого песка в эту зону для укрепления пустот. Песок хлынул в зал через трещины в потолке — прямо когда внутри находились люди. Катафилы выбрались, но зал был погребён. Позднее его откопали обратно. Название Zlard — катафильское прозвище, а историческое имя — Salle des Trois Chatières (Зал Трёх Лазов): три узких прохода-chatière вели в соседние галереи.</p><div class=\"p-sc\">Зона Broussais</div><p>Район Rue Broussais, где стоит зал, известен нестабильностью: уровень воды может за несколько недель подняться от сухого пола до непроходимого. IGC продолжает инъекции в этой зоне — часть галерей к январю 2006 года была частично залита повторно.</p>", "en": "<p>In 1999 the IGC began injecting liquid sand into this zone to consolidate the voids. The sand poured into the room through cracks in the ceiling — just as people were inside. The cataphiles got out, but the room was buried. It was later dug back out. «Zlard» is a cataphile nickname; the historical name is Salle des Trois Chatières (Room of the Three Crawlways): three narrow chatière passages led into the neighbouring galleries.</p><div class='p-sc'>The Broussais zone</div><p>The Rue Broussais area, where the room sits, is known for instability: the water level can rise from a dry floor to impassable within a few weeks. The IGC keeps injecting in this zone — some of the galleries had been partly re-flooded again by January 2006.</p>"}}, {"id": "dragon-room", "lat": 48.839, "lng": 2.341, "lb": {"ru": "ЗАЛ ДРАКОНА", "en": "ROOM OF THE DRAGON"}, "t": {"ru": "Зал Дракона", "en": "The Room of the Dragon"}, "s": {"ru": "Dragon Room · Катафильское искусство", "en": "Dragon Room · Cataphile art"}, "h": {"ru": "<p>Зал с большой фреской дракона на стене. Расположен в северной части сети, рядом с Dinosaur Room и Depot — целый квартал залов с катафильским искусством. Этот район — одна из первых остановок для групп, спускающихся через южные входы. Здесь же ночевали английские исследователи из 28DaysLater во время их четырёхдневной экспедиции 2016 года.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/dragon-room.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/dragon-room-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A room with a large dragon mural on the wall. It lies in the north of the network, next to the Dinosaur Room and the Depot — a whole district of rooms full of cataphile art. This area is one of the first stops for groups coming down through the southern entrances. It is also where the English explorers from 28DaysLater spent the night during their four-day expedition of 2016.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/dragon-room.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/dragon-room-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "bdm", "lat": 48.822, "lng": 2.332, "lb": {"ru": "КРАЙ СВЕТА", "en": "END OF THE WORLD"}, "t": {"ru": "Край света", "en": "The End of the World"}, "s": {"ru": "Bout du Monde (B.D.M) · Южная граница сети", "en": "Bout du Monde (B.D.M) · The southern edge of the network"}, "h": {"ru": "<p>300 километров галерей — и вот они кончаются. Тупик. Дальше — монолитная порода. Катафилы назвали это место «Край света» (Bout du Monde). Добраться сюда — многочасовой переход через затопленные галереи и узкие лазы. Те, кто дошёл, оставляют надписи на стене — как путешественники на краю карты.</p>", "en": "<p>Three hundred kilometres of galleries — and here they end. A dead end. Beyond it, solid rock. Cataphiles called this place the «End of the World» (Bout du Monde). Getting here is a journey of many hours through flooded galleries and narrow crawlways. Those who make it leave inscriptions on the wall — like travellers at the edge of the map.</p>"}}, {"id": "skating-rink", "lat": 48.832, "lng": 2.327, "lb": {"ru": "КАТОК", "en": "THE RINK"}, "t": {"ru": "Каток", "en": "The Skating Rink"}, "s": {"ru": "Patinoire · Скользкая галерея", "en": "Patinoire · A slippery gallery"}, "h": {"ru": "<p>Галерея с постоянным водяным потоком через потолок. Известняковый пол покрыт тонким слоем кальцита — минерала, который откладывается при испарении воды. Поверхность становится гладкой как лёд. На карте помечена как «Slippery» — скользкая. Расположена в восточной части сети, рядом с районом Sainte-Anne.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-patinoire.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-patinoire-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A gallery with a constant flow of water through the ceiling. The limestone floor is coated with a thin layer of calcite — the mineral that is deposited as water evaporates. The surface becomes as smooth as ice. On the map it is marked «Slippery». It lies in the east of the network, near the Sainte-Anne area.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-patinoire.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-patinoire-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "church", "lat": 48.821, "lng": 2.319, "lb": {"ru": "ЦЕРКОВЬ", "en": "THE CHURCH"}, "t": {"ru": "Подземная церковь", "en": "The Underground Church"}, "s": {"ru": "L’Église · Работа каменотёсов", "en": "L’Église · The work of quarrymen"}, "h": {"ru": "<p>Под землёй — помещение с высоким сводом, напоминающее церковный неф. Каменотёсы вырубили его прямо под садом церкви Святого Антония и Робера, и кажется, что архитектура наверху отпечаталась внизу. На карте explographies это место отмечено редкой пометкой: «remarkable work» — выдающаяся работа.</p>", "en": "<p>Underground, a high-vaulted chamber that resembles a church nave. The quarrymen cut it directly beneath the garden of the church of Saint-Antoine and Robert, and it seems as though the architecture above has imprinted itself below. On the explographies map this spot bears a rare note: «remarkable work».</p>"}}, {"id": "rats-bar", "lat": 48.834, "lng": 2.328, "lb": {"ru": "БАР КРЫС", "en": "THE RATS BAR"}, "t": {"ru": "Бар Крыс", "en": "The Rats Bar"}, "s": {"ru": "The Rats Bar · 1980-е · Подземное граффити", "en": "The Rats Bar · 1980s · Underground graffiti"}, "h": {"ru": "<p>«Крысы» (The Rats) — легендарная группа катафилов 1980-х, которая первой начала расписывать стены катакомб. До них под землёй были только надписи каменотёсов XVIII века. Крысы превратили свой зал в галерею: стены покрыты яркими фресками, которые сохранились до сих пор. Считается, что именно они запустили традицию подземного искусства, подхваченную сотнями катафилов после них.</p><p><a href=\"https://www.catacombes.xyz/explore/rats\" target=\"_blank\" style=\"color:#b08d57\">➡ Смотреть в 3D на catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>«The Rats» were a legendary group of cataphiles from the 1980s who were the first to paint the walls of the catacombs. Before them, the only things underground were the 18th-century inscriptions of the quarrymen. The Rats turned their room into a gallery: the walls are covered in vivid murals that survive to this day. They are credited with starting the tradition of underground art that hundreds of cataphiles took up after them.</p><p><a href='https://www.catacombes.xyz/explore/rats' target='_blank' style='color:#b08d57'>➡ View in 3D at catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rats-bar-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "feast-room", "lat": 48.828, "lng": 2.333, "lb": {"ru": "ЗАЛ ПИРОВ", "en": "ROOM OF FEASTS"}, "t": {"ru": "Зал Пиров", "en": "The Room of Feasts"}, "s": {"ru": "Salle des Fêtes · Pig Room · Большой подземный зал", "en": "Salle des Fêtes · Pig Room · A large underground hall"}, "h": {"ru": "<p>Огромный зал с высокими сводами — одно из самых больших пространств в нелегальной части сети. Катафилы устраивают здесь многолюдные подземные банкеты: вино, сыр, свечи, гитара. Попасть сюда можно только через узкий лаз (chatière). Представьте: вы ползёте на животе 10 метров в полной темноте, а потом оказываетесь в зале размером с церковь, где 30 человек сидят за каменным столом.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-banquet.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A vast, high-vaulted hall — one of the largest spaces in the illegal part of the network. Cataphiles hold crowded underground banquets here: wine, cheese, candles, a guitar. The only way in is through a narrow crawlway (chatière). Picture it: you crawl on your belly for 10 metres in total darkness, and then you come out into a hall the size of a church, where 30 people sit around a stone table.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-banquet.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "ossa-arida", "lat": 48.838, "lng": 2.345, "lb": {"ru": "OSСА ARIDA", "en": "OSSA ARIDA"}, "t": {"ru": "Osса Arida", "en": "Ossa Arida"}, "s": {"ru": "Резные растения · Carved plants · XVIII век", "en": "Carved plants · Carved plants · 18th century"}, "h": {"ru": "<p>Название из латинской Библии — «сухие кости» (Иезекииль 37). На стене высечены растительные орнаменты XVIII века — работа неизвестного каменотёса, который превратил стену каменоломни в произведение искусства. Резьба сохранилась в идеальном состоянии благодаря постоянной температуре 14°C и отсутствию солнечного света.</p>", "en": "<p>The name comes from the Latin Bible — «dry bones» (Ezekiel 37). Plant ornaments from the 18th century are carved into the wall — the work of an unknown quarryman who turned a quarry wall into a work of art. The carving survives in perfect condition thanks to the constant 14°C and the absence of sunlight.</p>"}}, {"id": "ram-room", "lat": 48.832, "lng": 2.335, "lb": {"ru": "ЗАЛ БАРАНА", "en": "ROOM OF THE RAM"}, "t": {"ru": "Зал Барана", "en": "The Room of the Ram"}, "s": {"ru": "Salle du Bélier · Скульптуры · Каменная резьба", "en": "Salle du Bélier · Sculptures · Stone carving"}, "h": {"ru": "<p>Зал со скульптурами и сводчатым потолком, построенный катафилами. Здесь тайлёры (каменотёсы-любители) тренируются вырезать розетки и орнаменты — традиция, идущая от профессиональных каменотёсов XVIII века. В 2001 году зал попал в 20-часовые новости TF1: катафилы «Le Duc» и «Yoyo» дали здесь интервью, объясняя свой кодекс: «Планы карьер не раздают просто так — их нужно заслужить».</p>", "en": "<p>A room with sculptures and a vaulted ceiling, built by cataphiles. Here the tailleurs (amateur stone-carvers) practise carving rosettes and ornaments — a tradition descended from the professional quarrymen of the 18th century. In 2001 the room appeared on TF1’s 8 o’clock news: the cataphiles «Le Duc» and «Yoyo» gave an interview here, explaining their code: «Quarry maps aren’t handed out for free — you have to earn them.»</p>"}}, {"id": "feuillantines", "lat": 48.843, "lng": 2.345, "lb": {"ru": "АБРИ ФЁЙАНТИН", "en": "ABRI FEUILLANTINES"}, "t": {"ru": "Убежище Фёйантин", "en": "The Feuillantines Shelter"}, "s": {"ru": "Abri Laval · 1941–1944 · Бункер Виши", "en": "Abri Laval · 1941–1944 · A Vichy bunker"}, "h": {"ru": "<p>1941 год — под школой на rue des Feuillantines строят бомбоубежище для детей. В феврале 1944 правительство Виши решает переделать его в личный бункер Пьера Лаваля на 60 человек: десять спален, кухня, лазарет, отопление, кондиционирование, автономная канализация. Строительство не завершено — Париж освобождён раньше.</p><div class=\"p-sc\">После Освобождения</div><p>Полковник Роль-Танги командовал восстанием из подземного штаба на Denfert-Rochereau. После освобождения Парижа 28 августа 1944 он переехал в здание Feuillantines на поверхности. Бункер Лаваля был выбран изначально благодаря прямой связи с сетью карьеров и собственному телефонному узлу, подключённому к метро — 250 точек связи по Парижу.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>1941 — beneath a school on Rue des Feuillantines an air-raid shelter is built for children. In February 1944 the Vichy government decides to convert it into a personal bunker for Pierre Laval, for 60 people: ten bedrooms, a kitchen, an infirmary, heating, air conditioning, its own sewage system. Construction is never finished — Paris is liberated first.</p><div class='p-sc'>After the Liberation</div><p>Colonel Rol-Tanguy commanded the uprising from the underground headquarters at Denfert-Rochereau. After the liberation of Paris on 28 August 1944 he moved into the Feuillantines building on the surface. Laval’s bunker had been chosen in the first place for its direct link to the quarry network and its own telephone exchange, connected to the métro — 250 communication points across Paris.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/feuillantines-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "faco-shelter", "lat": 48.845, "lng": 2.328, "lb": {"ru": "УБЕЖИЩЕ ФАКО", "en": "FACO SHELTER"}, "t": {"ru": "Убежище Фако", "en": "The Faco Shelter"}, "s": {"ru": "Abri Faco · Ядерное убежище · Rue Notre Dame des Champs, 177", "en": "Abri Faco · A nuclear shelter · 177 Rue Notre-Dame-des-Champs"}, "h": {"ru": "<p>Противоядерное убежище времён Холодной войны, расположенное в карьерах под Rue Notre Dame des Champs, 177. Рассчитано на 100 человек, оборудовано четырьмя туалетами. Главная деталь — аварийный генератор на педальных велосипедах: если электричество пропадало, люди внутри должны были крутить педали, чтобы работала вентиляция и никто не задохнулся.</p><div class=\"p-sc\">Под Парижем</div><p>Париж был густо уложен подобными убежищами — под Gare de l’Est, под Lycée Montaigne, под лабораторией Ponts et Chaussées. Большинство заброшены или перестроены. Abri Faco — одно из немногих, сохранившихся в катакомбах в узнаваемом виде.</p>", "en": "<p>A Cold War-era nuclear shelter, in the quarries beneath 177 Rue Notre-Dame-des-Champs. Designed for 100 people and fitted with four toilets. Its key feature is an emergency generator powered by pedal bicycles: if the electricity failed, the people inside were meant to pedal so the ventilation kept working and no one suffocated.</p><div class='p-sc'>Beneath Paris</div><p>Paris was densely packed with shelters like this — beneath the Gare de l’Est, beneath the Lycée Montaigne, beneath the Ponts et Chaussées laboratory. Most are abandoned or rebuilt. Abri Faco is one of the few preserved in the catacombs in recognisable form.</p>"}}, {"id": "saratte-memorial", "lat": 48.823, "lng": 2.326, "lb": {"ru": "МЕМОРИАЛ САРАТТА", "en": "SARATTE MEMORIAL"}, "t": {"ru": "Мемориал Жан-Клода Саратта", "en": "Memorial to Jean-Claude Saratte"}, "s": {"ru": "Rue Saratte · Первый «катафлик» Франции · ERIC 1980–1999", "en": "Rue Saratte · France’s first «catacop» · ERIC 1980–1999"}, "h": {"ru": "<p>Мозаичная табличка в честь коменданта Жан-Клода Саратта — первого «катафлика» Франции. В 1980 году он основал ERIC (Équipe de Recherche et d’Intervention en Carrières) — единственную полицейскую бригаду, которая патрулирует каменоломни. Метод Саратта — профилактика, а не репрессия. Его команда вела базу данных катафилов по подземным псевдонимам — на случай, если кто-то пропадёт.</p><div class=\"p-sc\">Катафил в форме</div><p>Со временем Саратт сам стал катафилом: гулял по галереям в нерабочее время просто ради удовольствия. Когда в 2000 году он ушёл на пенсию, катафилы устроили ему прощальную вечеринку прямо под землёй — не «ура, избавились», а «спасибо». Галерея получила его имя: Rue Saratte.</p>", "en": "<p>A mosaic plaque in honour of commander Jean-Claude Saratte — France’s first «catacop». In 1980 he founded ERIC (Équipe de Recherche et d’Intervention en Carrières) — the only police brigade that patrols the quarries. Saratte’s method was prevention, not repression. His team kept a database of cataphiles by their underground pseudonyms — in case anyone went missing.</p><div class='p-sc'>A cataphile in uniform</div><p>In time Saratte became a cataphile himself: he wandered the galleries off-duty, simply for the pleasure of it. When he retired in 2000, the cataphiles threw him a farewell party underground — not a «good riddance», but a «thank you». The gallery took his name: Rue Saratte.</p>"}}, {"id": "bent-pillar", "lat": 48.836, "lng": 2.338, "lb": {"ru": "НАКЛОННЫЙ СТОЛБ", "en": "THE BENT PILLAR"}, "t": {"ru": "Наклонный столб", "en": "The Bent Pillar"}, "s": {"ru": "The Bent Pillar · Pilier tombé · Курьёз каменоломен", "en": "The Bent Pillar · Pilier tombé · A curiosity of the quarries"}, "h": {"ru": "<p>Любопытным образом бросая вызов закону гравитации, этот опорный столб, стоявший у одной стены галереи, упал на противоположную стену. Одна из курьёзных достопримечательностей подземных каменоломен.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bent-pillar.jpg\" alt=\"Наклонный столб\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bent-pillar.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><div class=\"p-cap\">Рисунок с карты CUBE · explographies.com</div>", "en": "<p>In a curious defiance of the law of gravity, this support pillar, which stood against one wall of the gallery, fell against the opposite wall. One of the curiosities of the underground quarries.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bent-pillar.jpg\" alt=\"The Bent Pillar\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bent-pillar.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><div class=\"p-cap\">Drawing from the CUBE map · explographies.com</div>"}}, {"id": "solcarlus", "lat": 48.828, "lng": 2.363, "lb": {"ru": "СОЛКАРЛУС", "en": "SOLCARLUS"}, "t": {"ru": "Солкарлус", "en": "Solcarlus"}, "s": {"ru": "Solcarlus · Rue Jeanne d’Arc, 75013 · Глубина 20 м", "en": "Solcarlus · 75 Rue Jeanne-d’Arc · 20 m deep"}, "h": {"ru": "<p>Зал в каменоломнях под 13-м округом, район Rue Jeanne d’Arc, на глубине 20 метров. Часть отдельной от Большой Южной Сети (GRS) системы карьеров — сюда нельзя попасть из основной сети, нужен отдельный вход.</p><div class=\"p-sc\">Происхождение названия</div><p>Солкарлус — персонаж из рекламного ролика 1983 года, снятого Дино Ризи: хитрый слуга Цезаря, которого играл комик Жан-Мари Прослье. Ролик стал культовым, а катафилы присвоили имя залу.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/solcarlus.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><p><a href=\"https://www.catacombes.xyz/explore/solcarlus\" target=\"_blank\" style=\"color:#b08d57\">➡ Смотреть в 3D на catacombes.xyz</a></p>", "en": "<p>A room in the quarries beneath the 13th arrondissement, in the Rue Jeanne-d’Arc area, 20 metres down. Part of a quarry system separate from the Great Southern Network (GRS) — you cannot reach it from the main network; it needs its own entrance.</p><div class='p-sc'>Where the name comes from</div><p>Solcarlus is a character from a 1983 commercial directed by Dino Risi: the cunning servant of Caesar, played by the comedian Jean-Marie Proslier. The advert became a cult favourite, and the cataphiles gave the room its name.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/solcarlus.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><p><a href='https://www.catacombes.xyz/explore/solcarlus' target='_blank' style='color:#b08d57'>➡ View in 3D at catacombes.xyz</a></p>"}}, {"id": "usine-gaz-choisy", "lat": 48.822, "lng": 2.359, "lb": {"ru": "ГАЗОВАЯ ФАБРИКА", "en": "GAS WORKS"}, "t": {"ru": "Под бывшей газовой фабрикой", "en": "Beneath the former gas works"}, "s": {"ru": "Parc de Choisy, 13-й округ", "en": "Parc de Choisy, 13th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/usine-gaz-choisy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/usine-gaz-choisy.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-paul-fort", "lat": 48.828, "lng": 2.33, "lb": {"ru": "RUE PAUL FORT", "en": "RUE PAUL FORT"}, "t": {"ru": "Под улицей Поль Фор", "en": "Beneath Rue Paul-Fort"}, "s": {"ru": "14-й округ", "en": "14th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-paul-fort.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-paul-fort.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "vertigo", "lat": 48.819, "lng": 2.358, "lb": {"ru": "ВЕРТИГО", "en": "VERTIGO"}, "t": {"ru": "Вертиго", "en": "Vertigo"}, "s": {"ru": "Boulevard Masséna, 13-й округ · Глубокий колодец", "en": "Boulevard Masséna, 13th arr. · A deep well"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/vertigo.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/vertigo.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cimetiere-montparnasse", "lat": 48.838, "lng": 2.327, "lb": {"ru": "КЛАДБИЩЕ МОНПАРНАС", "en": "MONTPARNASSE CEMETERY"}, "t": {"ru": "Кладбище Монпарнас", "en": "Montparnasse Cemetery"}, "s": {"ru": "14-й округ · 1824 · 19 гектаров · Над катакомбами", "en": "14th arr. · 1824 · 19 hectares · Above the catacombs"}, "h": {"ru": "<p>Открыто в 1824 году как «Cimetière du Sud» — Южное кладбище, за чертой тогдашнего Парижа (граница шла по Стене Откупщиков). Расположено прямо над сетью каменоломен. Здесь лежат Бодлер, Мопассан, Сартр и Симона де Бовуар (в одной могиле), Серж Генсбур, Сезар, Маргерит Дюрас, Брассенс, Андре Ситроен. Среди могил сохранилась мельница XVIII века — Moulin de la Charité — последний свидетель того, что до кладбища здесь была ферма.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Opened in 1824 as the «Cimetière du Sud» — the Southern Cemetery, beyond the Paris of the time (the boundary ran along the Wall of the Farmers-General). It lies directly above the quarry network. Buried here are Baudelaire, Maupassant, Sartre and Simone de Beauvoir (in a single grave), Serge Gainsbourg, César, Marguerite Duras, Brassens and André Citroën. Among the graves stands a surviving 18th-century mill — the Moulin de la Charité — the last witness that before the cemetery there was a farm here.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cimetiere-montparnasse-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cave-charbon", "lat": 48.836, "lng": 2.352, "lb": {"ru": "УГОЛЬНЫЙ ПОДВАЛ", "en": "COAL CELLAR"}, "t": {"ru": "Угольный подвал", "en": "The Coal Cellar"}, "s": {"ru": "Rue Le Brun, 13-й округ", "en": "Rue Le Brun, 13th arr."}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cave-charbon.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cave-charbon.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "boulevard-brune", "lat": 48.823, "lng": 2.325, "lb": {"ru": "BLD BRUNE", "en": "BLD BRUNE"}, "t": {"ru": "Под бульваром Брюн", "en": "Beneath Boulevard Brune"}, "s": {"ru": "14-й округ · Линия Стены Тьера", "en": "14th arr. · Line of the Thiers Wall"}, "h": {"ru": "<p>Бульвар Брюн проложен по линии бывшей оборонительной стены Тьера (1840–1844) — последней крепостной стены Парижа, снесённой в 1920-х. Вдоль всего «маленького пояса» бульваров на её месте — каменоломни, по которым когда-то возили строительный камень для самой стены.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/boulevard-brune.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Boulevard Brune runs along the line of the former Thiers fortifications (1840–1844) — the last city wall of Paris, demolished in the 1920s. Along the whole «little belt» of boulevards on its site lie the quarries from which the stone for the wall itself was once hauled.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/boulevard-brune.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "rue-chaillot", "lat": 48.866, "lng": 2.3, "lb": {"ru": "RUE DE CHAILLOT", "en": "RUE DE CHAILLOT"}, "t": {"ru": "Под улицей Шайо", "en": "Beneath Rue de Chaillot"}, "s": {"ru": "16-й округ · Холм Шайо", "en": "16th arr. · The Chaillot hill"}, "h": {"ru": "<img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/rue-chaillot.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<img class=\"p-img\" src=\"https://raw.githubusercon
