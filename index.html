<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Карта Парижских Катакомб</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --paper-bg: #f2e8d5;
  --ink-color: #2b2824;
  --card-bg: #faf6ee;
  --accent-ink: #85665e;
  --dark-card-bg: #85665e;
  --soft-text: rgba(43, 40, 36, 0.85);
  --marker-color: #693956;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Work Sans', sans-serif;
  background: var(--paper-bg);
  color: var(--ink-color);
  height: 100vh;
  overflow: hidden;
  text-transform: lowercase;
}

#paper-texture {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  background-image: url("https://transparenttextures.com/patterns/black-paper.png");
  mix-blend-mode: multiply;
  opacity: 0.12;
}

.print-border {
  position: relative;
  border: none !important;
  box-shadow: none !important;
}
.print-border::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 2px solid var(--b-color, var(--ink-color));
  pointer-events: none;
  filter: url(#ink-bleed);
  z-index: 10;
}

.btn-simple {
  position: relative;
  background: transparent;
  color: var(--ink-color);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, color 0.2s;
}
.btn-simple::after {
  content: ''; position: absolute; inset: 0;
  border: 2px solid var(--b-color, var(--ink-color));
  pointer-events: none; filter: url(#ink-bleed);
}
.btn-simple:hover {
  background: var(--ink-color);
  color: var(--card-bg);
}

::placeholder { color: rgba(43, 40, 36, 0.4); opacity: 1; }

#map {
  width:100%; height:100vh; z-index:1;
  filter: contrast(1.02) grayscale(0.05);
}

.leaflet-control-attribution { font-size:8px!important; opacity:.5; text-transform: lowercase; color: var(--ink-color) !important;}
.leaflet-control-attribution a { color: var(--accent-ink) !important; }

.leaflet-control-zoom {
  border: none !important; box-shadow: none !important;
  display: flex; flex-direction: column; gap: 8px; background: transparent !important;
  margin-bottom: 24px !important; margin-right: 24px !important;
}
.leaflet-control-zoom a {
  background-color: var(--card-bg) !important;
  background-image: url('https://transparenttextures.com/patterns/beige-paper.png') !important;
  color: var(--ink-color) !important;
  font-family: 'Work Sans', sans-serif !important;
  border: 2px solid var(--ink-color) !important;
  border-radius: 0 !important;
  width: 36px !important; height: 36px !important; line-height: 32px !important;
  font-size: 20px !important;
}
.leaflet-control-zoom a:hover {
  background-color: var(--ink-color) !important;
  background-image: none !important;
  color: var(--card-bg) !important;
}

.light-panel {
  background-color: var(--paper-bg);
  background-image: url('https://transparenttextures.com/patterns/beige-paper.png');
  color: var(--ink-color);
  --b-color: var(--ink-color);
}

.panel-card {
  background-color: var(--card-bg);
  background-image: url('https://transparenttextures.com/patterns/beige-paper.png');
  color: var(--ink-color);
  --b-color: var(--ink-color);
}

#title {
  position:fixed; top:20px; left:20px; z-index:1000;
  padding:14px 20px 12px;
  max-width:400px;
}
#title h1 { font-weight:500; font-size:18px; line-height:1.15; color: var(--ink-color); }
#title .sub {
  font-size:11px; letter-spacing:.05em; color: var(--soft-text);
  margin-top:6px; border-top:1px solid var(--ink-color); padding-top:6px; font-weight:400;
}

#tl {
  position:fixed; bottom:20px; left:20px; z-index:1000;
  padding:16px 20px; width:280px; max-height:65vh;
  display: flex; flex-direction: column;
}
.tl-scroll {
  overflow-y:auto; flex: 1; min-height: 0; padding-right: 8px;
}
.tl-scroll::-webkit-scrollbar { width:4px; }
.tl-scroll::-webkit-scrollbar-thumb { background:var(--ink-color); }
#tl h3 {
  font-size:13px; font-weight:600; color: var(--ink-color);
  margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--ink-color);
}
.te { display:flex; gap:12px; margin:8px 0; line-height:1.35; font-size:10.5px; }
.ty { font-weight:600; min-width:65px; flex-shrink:0; color: var(--ink-color); }
.tv { font-weight:500; color: var(--soft-text); }

#idx-btn {
  position:fixed; top:20px; right:20px; z-index:1000;
  padding:10px 18px;
  font-family:'Work Sans', sans-serif; font-size:12px; font-weight: 500;
  color: var(--ink-color);
}

#idx {
  position:fixed; top:0; right:-340px; width:320px; max-width:88vw; height:100vh; z-index:1001;
  transition:right .35s ease; padding:0;
}
#idx.open { right:0; }
.idx-scroll { overflow-y:auto; height:100%; width: 100%; }
.idx-scroll::-webkit-scrollbar { width:4px; }
.idx-scroll::-webkit-scrollbar-thumb { background:var(--ink-color); }

.ix-hd { padding:14px 16px 10px; border-bottom:1px solid var(--ink-color); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card-bg); z-index:2; }
.ix-hd h2 { font-size:14px; font-weight:500; letter-spacing:.05em; color: var(--ink-color); }
.ix-cl { width:28px; height:28px; font-size:16px; color: var(--ink-color); }
.ix-sec { padding:12px 16px 4px; font-size:11px; font-weight:500; color: var(--ink-color); border-bottom:1px solid var(--ink-color); opacity: 0.8; margin-top:10px; }
.ix-it { padding:8px 16px; cursor:pointer; border-bottom:1px solid rgba(43, 40, 36,.1); transition:background .12s; }
.ix-it:hover { background:rgba(43, 40, 36,.04); }
.ix-nm { font-size:13px; font-weight:500; color: var(--ink-color); }
.ix-ds { font-size:11px; font-weight:400; color: var(--soft-text); margin-top:3px; }

#ov { position:fixed; inset:0; z-index:1002; background:rgba(26,26,24,0.4); opacity:0; pointer-events:none; transition:opacity .3s; }
#ov.on { opacity:1; pointer-events:all; }

#pn {
  position:fixed; top:4vh; left:50%; transform:translateX(-50%) translateY(20px);
  width:min(640px,93vw); height:auto; max-height:90vh; z-index:1003;
  background-color: var(--card-bg);
  background-image: url("https://transparenttextures.com/patterns/beige-paper.png");
  color: var(--ink-color);
  --b-color: var(--ink-color);
  opacity:0; pointer-events:none; transition:opacity .3s,transform .3s;
}
#pn.on { opacity:1; pointer-events:all; transform:translateX(-50%) translateY(0); }

.pn-scroll { overflow-y: auto; width: 100%; max-height: calc(90vh - 6px); }
.pn-scroll::-webkit-scrollbar { width:4px; }
.pn-scroll::-webkit-scrollbar-thumb { background:var(--ink-color); }

.p-hd { padding:16px 20px 12px; border-bottom:1px solid var(--ink-color); position:relative; }
.p-hd h2 { font-weight:500; font-size:clamp(20px,3vw,26px); line-height:1.2; padding-right:80px; color: var(--ink-color); }
.p-hd .p-sb { font-size:14px; font-weight:400; color: var(--soft-text); margin-top:6px; }
.p-cl { position:absolute; top:16px; right:16px; width:32px; height:32px; font-size:18px; color: var(--ink-color); }
.p-au { position:absolute; top:16px; right:56px; width:32px; height:32px; font-size:14px; color: var(--ink-color); }
.p-au.playing { background:var(--ink-color); color:var(--card-bg); }

.p-bd { padding: 16px 20px 28px; }
.p-bd p {
  font-size: 16px; font-weight: 400; line-height: 1.7;
  color: var(--soft-text); margin-bottom: 12px; text-align: left;
}
.p-bd p:first-of-type::first-letter { font-size:3.2em; float:left; line-height:.8; padding-right:10px; padding-top:4px; font-weight:500; color:var(--ink-color); }

.p-sc {
  display: inline-block; font-size:12px; font-weight:500; letter-spacing:.05em;
  border: 1px solid var(--ink-color); color: var(--ink-color);
  padding: 4px 10px; margin: 24px 0 12px;
}
.p-qt { border-left:4px solid var(--accent-ink); background: rgba(133, 102, 94, 0.05); padding:14px 18px; margin:20px 0; font-size:15px; font-weight:400; font-style: italic; color: var(--soft-text); }
.p-ft { display:flex; gap:8px; margin:6px 0; font-size:13px; font-weight:400; color: var(--soft-text); }
.p-ft b { font-size:11px; font-weight:500; min-width:70px; flex-shrink:0; padding-top:2px; color: var(--ink-color); }

.p-img {
  width: 100%;
  border: 1px solid rgba(43, 40, 36, 0.4);
  margin: 10px 0 4px;
  display: block;
}
.p-img[hidden] { display:none; }
.p-cap { font-size:10px; font-weight:500; color: var(--soft-text); text-align:center; margin-bottom:10px; }

.p-vid{position:relative;width:100%;padding-bottom:56.25%;margin:12px 0;border:1px solid rgba(43,40,36,0.4);background:#1a1a18;cursor:pointer;overflow:hidden}
.p-vid iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.p-vid-thumb{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.p-vid-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:42px;background:rgba(133,102,94,.85);border-radius:8px;display:flex;align-items:center;justify-content:center}
.p-vid-play:after{content:"";border-style:solid;border-width:10px 0 10px 18px;border-color:transparent transparent transparent var(--card-bg)}
.p-need{background:rgba(133,102,94,0.05);border:1px dashed var(--accent-ink);padding:10px 14px;margin:10px 0;font-size:11px;color:var(--soft-text);font-style:italic}

.cm { width:12px; height:12px; background:var(--dark-card-bg); border:2px solid var(--paper-bg); border-radius:50%; cursor:pointer; transition:transform .2s; }
.cm:hover { transform:scale(1.5); background:var(--paper-bg); border-color:var(--dark-card-bg); }
.cl { font-family:'Work Sans', sans-serif!important; font-size:10px!important; font-weight:600!important; color:var(--ink-color)!important; white-space:nowrap; text-transform: lowercase; }

@media(max-width:600px){
  #title { max-width:calc(100vw - 128px); padding:8px 12px; top:12px; left:12px; }
  #title h1 { font-size:13px; line-height:1.2; }
  #title .sub { font-size:9.5px; margin-top:4px; padding-top:4px; letter-spacing:.03em; }
  #tl { display:none; }
  #idx-btn { position:fixed; top:12px; right:12px; padding:7px 10px; font-size:10.5px; }
  #idx { width:100vw; max-width:100vw; right:-100vw; height:100vh; height:100dvh; }
  #pn { width:100vw; top:0; left:0; transform:none; max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; }
  #pn::after { display: none; }
  #pn.on { transform:none; }
  .pn-scroll { max-height:100vh; max-height:100dvh; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 40px; }
  .p-hd { padding:16px 16px 12px; }
  .p-bd { padding:0 16px 24px; }
  .leaflet-control-zoom { display: none !important; }
  /* Disable ink-bleed filter on mobile - Safari renders it with halo artifacts */
  .print-border::after, .btn-simple::after { filter: none !important; border-width: 1.5px; }
}

/* === AUDIO ENHANCEMENTS === */
#audio-progress {
  position: absolute;
  top: 0; left: 0;
  height: 2px;
  background: var(--accent-ink);
  width: 0%;
  transition: width 0.3s ease;
  z-index: 20;
}
.p-bd p.audio-active {
  background: rgba(133, 102, 94, 0.06);
  border-radius: 2px;
  margin-left: -6px;
  margin-right: -6px;
  padding-left: 6px;
  padding-right: 6px;
  transition: background 0.3s;
}
.audio-speed {
  position: absolute;
  top: 16px;
  right: 96px;
  width: 32px; height: 32px;
  font-size: 9px;
  font-weight: 600;
  font-family: 'Work Sans', sans-serif;
  letter-spacing: -0.02em;
  color: var(--ink-color);
}


#lang-toggle { position:fixed; top:20px; right:180px; z-index:1001; display:flex; align-items:stretch; }
.lang-opt { background:transparent; border:none; cursor:pointer; font-family:'Work Sans', sans-serif; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-color); padding:9px 14px; min-width:44px; transition:background .18s, color .18s; }
.lang-opt + .lang-opt { border-left:2px solid var(--ink-color); }
.lang-opt.active { background:var(--ink-color); color:var(--card-bg); }
.lang-opt:not(.active):hover { background:rgba(43,40,36,0.07); }
@media (max-width: 768px) {
  #lang-toggle { position:fixed; bottom:18px; top:auto; left:14px; right:auto; }
  .lang-opt { padding:8px 12px; font-size:11px; min-width:40px; }
}

</style>
</head>
<body>

<svg style="position: absolute; width: 0; height: 0;">
  <filter id="ink-bleed">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div id="paper-texture"></div>



<div id="map"></div>

<div id="title" class="print-border panel-card">
  <h1 id="main-title">карта парижских катакомб</h1>
  <div class="sub" id="main-sub">подземные каменоломни · большая южная сеть · интерактивный путеводитель</div>
</div>

<button id="idx-btn" class="print-border panel-card btn-simple" onclick="toggleIdx()">оглавление</button>

<div id="lang-toggle" class="print-border panel-card">
  <button class="lang-opt" data-lang="ru" onclick="setLang('ru')">RU</button>
  <button class="lang-opt active" data-lang="en" onclick="setLang('en')">EN</button>
</div>

<div id="idx" class="print-border panel-card">
  <div class="idx-scroll" id="idx-content"></div>
</div>

<div id="tl" class="print-border panel-card">
  <div class="tl-scroll">
    <h3 id="tl-title">ключевые даты</h3>
    <div id="tl-entries"></div>
  </div>
</div>

<div id="ov" onclick="cp()"></div>

<div id="pn" class="print-border">
  <div class="pn-scroll">
    <div class="p-hd">
      <h2 id="pt"></h2>
      <div class="p-sb" id="ps"></div>
      <button class="audio-speed btn-simple" id="speed-btn" onclick="cycleSpeed()" title="Скорость">1.0×</button>
      <button class="p-au btn-simple" id="au-btn" onclick="toggleAudio()" title="Прослушать">&#9654;</button>
      <button class="p-cl btn-simple" onclick="cp()">&times;</button>
    </div>
    <div id="audio-progress"></div>
    <div class="p-bd" id="pb"></div>
  </div>
</div>

<script>
var map = L.map('map',{center:[48.831,2.336],zoom:14,minZoom:12,maxZoom:18,zoomControl:false});
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://osm.org/copyright">OSM</a>',
  subdomains:'abcd',maxZoom:19
}).addTo(map);


var P = [{"id": "ossuary", "lat": 48.8339, "lng": 2.3324, "lb": {"ru": "ОССУАРИЙ", "en": "OSSUARY"}, "t": {"ru": "Оссуарий — Империя Мёртвых", "en": "The Ossuary — Empire of the Dead"}, "s": {"ru": "Данфер-Рошеро · ~6 млн останков · 1786", "en": "Denfert-Rochereau · ~6 million remains · 1786"}, "h": {"ru": "<p>Крупнейший оссуарий в мире — всего 0,5% от общей сети каменоломен. Вход через неоклассический павильон Леду (1785). Посетители спускаются на 131 ступень в постоянную температуру 14°C, где хранятся останки примерно шести миллионов парижан.</p><div class=\"p-sc\">Почему он появился</div><p>К 1780-м годам Париж столкнулся с двумя кризисами. Бесконтрольная добыча камня выдолбила Левый берег. Стена кладбища Невинных рухнула 30 мая 1780 года. 7 апреля 1786 года каменоломни Томб-Иссуар были освящены как оссуарий. Ночные процессии покрытых чёрным повозок перевозили кости до 1860 года.</p><div class=\"p-sc\">Укладка костей</div><p>С 1810 года Эрикар де Тюри организовал останки в декоративные стены: бедренные кости чередуются с черепами в форме сердец, крестов и геометрических узоров. За фасадами останки сложены на 20–30 м в глубину.</p><div class=\"p-qt\">«Arrête! C’est ici l’Empire de la Mort»<br><small>«Стой! Здесь Империя Смерти»</small></div><div class=\"p-ft\"><b>Глубина</b> ~20 м (131 ступень)</div><div class=\"p-ft\"><b>Маршрут</b> 1,7 км</div><div class=\"p-ft\"><b>Останки</b> ~6 млн человек</div><div class=\"p-vid\" onclick=\"this.innerHTML='<iframe src=https://www.youtube.com/embed/i2yFuPWdWak?autoplay=1 allowfullscreen></iframe>';this.style.cursor='default'\"><img class=\"p-vid-thumb\" src=\"https://img.youtube.com/vi/i2yFuPWdWak/hqdefault.jpg\" alt=\"Video\"><div class=\"p-vid-play\"></div></div><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-4.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-9.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><div class=\"p-sc\">Фотографии Надара — 1861</div><p>В 1861 году Феликс Надар сделал первые фотографии с искусственным освещением — в полной темноте с бунзеновскими батареями и выдержкой до 18 минут. Он расставил манекены из универмага, одетые как каменотёсы, поскольку живые модели смазались бы.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/nadar.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The largest ossuary in the world — and just 0.5% of the whole quarry network. The entrance is a neoclassical pavilion by Ledoux (1785). Visitors descend 131 steps into a constant 14°C, where the remains of roughly six million Parisians are kept.</p><div class='p-sc'>Why it appeared</div><p>By the 1780s Paris faced two crises. Uncontrolled stone quarrying had hollowed out the Left Bank. The wall of the Cemetery of the Innocents collapsed on 30 May 1780. On 7 April 1786 the Tombe-Issoire quarries were consecrated as an ossuary. Nightly processions of black-draped carts carried bones here until 1860.</p><div class='p-sc'>Stacking the bones</div><p>From 1810 Héricart de Thury arranged the remains into decorative walls: femurs alternating with skulls in patterns of hearts, crosses and geometric designs. Behind these facades the bones are piled 20–30 m deep.</p><div class='p-qt'>«Arrête! C’est ici l’Empire de la Mort»<br><small>«Stop! This is the Empire of the Dead»</small></div><div class='p-ft'><b>Depth</b> ~20 m (131 steps)</div><div class='p-ft'><b>Route</b> 1.7 km</div><div class='p-ft'><b>Remains</b> ~6 million people</div><div class=\"p-vid\" onclick=\"this.innerHTML='<iframe src=https://www.youtube.com/embed/i2yFuPWdWak?autoplay=1 allowfullscreen></iframe>';this.style.cursor='default'\"><img class=\"p-vid-thumb\" src=\"https://img.youtube.com/vi/i2yFuPWdWak/hqdefault.jpg\" alt=\"Video\"><div class=\"p-vid-play\"></div></div><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-4.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-9.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ossuary-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><div class='p-sc'>Nadar’s photographs — 1861</div><p>In 1861 Félix Nadar made the first photographs taken with artificial light — in total darkness, using Bunsen batteries and exposures of up to 18 minutes. He posed department-store mannequins dressed as quarrymen, since living models would have blurred.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/nadar.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "port-mahon", "lat": 48.8333, "lng": 2.3332, "lb": {"ru": "ПОРТ-МАОН", "en": "PORT-MAHON"}, "t": {"ru": "Галерея Порт-Маон", "en": "The Port-Mahon Gallery"}, "s": {"ru": "Скульптуры Франсуа Декюра · 1777–1782", "en": "Sculptures by François Décure · 1777–1782"}, "h": {"ru": "<p>Франсуа Декюр попал в плен во время Семилетней войны (1756–1763), когда Франция и Англия воевали за контроль над Средиземноморьем. Он был военнопленным в крепости Порт-Маон (Port Mahon) на острове Менорка (Балеарские острова, Испания). После освобождения стал каменотёсом в IGC. Пять лет он тайно вырезал в обеденные перерывы три барельефа — в том числе 12-метровую копию крепости, где его держали в плену.</p><div class=\"p-sc\">Гибель</div><p>Погиб в 1782 году, когда потолок обрушился во время вырезания лестницы для публичного доступа.</p><!-- PLACEHOLDER: YouTube видео галереи Порт-Маон --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/port-mahon.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/port-mahon-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>François Décure was captured during the Seven Years’ War (1756–1763), when France and England fought for control of the Mediterranean. He was held prisoner in the fortress of Port Mahon on the island of Menorca (Balearic Islands, Spain). After his release he became a quarryman with the IGC. For five years, in his lunch breaks, he secretly carved three bas-reliefs — including a 12-metre copy of the fortress where he had been imprisoned.</p><div class='p-sc'>His death</div><p>He died in 1782 when the ceiling collapsed while he was cutting a staircase to give the public access.</p><!-- PLACEHOLDER: YouTube видео галереи Порт-Маон --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/port-mahon.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/port-mahon-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "foot-bath", "lat": 48.833, "lng": 2.3338, "lb": {"ru": "КУПАЛЬНЯ", "en": "FOOT-BATH"}, "t": {"ru": "Купальня каменотёсов", "en": "The Quarrymen’s Foot-Bath"}, "s": {"ru": "Невидимый бассейн · Первая геологическая скважина", "en": "An invisible pool · The first geological borehole"}, "h": {"ru": "<p>Этот колодец уходит к грунтовым водам. Вода настолько прозрачна, что практически невидима. Поколениями гиды пользовались этим: посетители спускались по ступенькам и нечаянно ступали в воду. Шутка прекратилась после установки электрического освещения в 1983.</p><div class=\"p-sc\">Научное значение</div><p>Первая геологическая скважина под Парижем. Исследование Эрикара де Тюри 1814 года стало международным эталоном для классификации лютецианского известняка.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/foot-bath.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/foot-bath-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>This well reaches down to the groundwater. The water is so clear it is almost invisible. For generations guides took advantage of this: visitors would come down the steps and step straight into the water by accident. The prank ended once electric lighting was installed in 1983.</p><div class='p-sc'>Scientific significance</div><p>The first geological borehole beneath Paris. Héricart de Thury’s 1814 survey became the international reference for classifying Lutetian limestone.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/foot-bath.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/foot-bath-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "samaritaine", "lat": 48.8328, "lng": 2.3345, "lb": {"ru": "САМАРИТЯНКА", "en": "SAMARITAINE"}, "t": {"ru": "Фонтан Самаритянки", "en": "The Samaritaine Fountain"}, "s": {"ru": "Источник Леты · Слепые золотые рыбки · 1810", "en": "Spring of Lethe · Blind goldfish · 1810"}, "h": {"ru": "<p>Построен в 1810 году в ротонде галереи. Назван в честь библейской самаритянки у колодца Иакова. Второе название — «Источник Леты» — отсылает к реке Забвения, где мёртвые пили воду, чтобы забыть земную жизнь.</p><div class=\"p-sc\">Золотые рыбки</div><p>В 1813 году Луи-Этьен Эрикар де Тюри, директор Инспекции каменоломен, поместил четырёх золотых рыбок в бассейн. Они выжили, но ослепли от полной темноты и не смогли размножаться — раннее наблюдение пещерной биологии.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-3.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-4.jpeg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Built in 1810 in a rotunda off the gallery. Named after the biblical Samaritan woman at Jacob’s well. Its second name — «Spring of Lethe» — refers to the river of oblivion, where the dead drank to forget their earthly life.</p><div class='p-sc'>The goldfish</div><p>In 1813 Louis-Étienne Héricart de Thury, director of the Quarry Inspectorate, placed four goldfish in the basin. They survived but went blind from the total darkness and could not breed — an early observation in cave biology.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-3.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/samaritaine-4.jpeg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "lamp", "lat": 48.8325, "lng": 2.335, "lb": {"ru": "ЛАМПА", "en": "THE LAMP"}, "t": {"ru": "Крипта Погребальной лампы", "en": "Crypt of the Sepulchral Lamp"}, "s": {"ru": "Первый монумент оссуария", "en": "The first monument of the ossuary"}, "h": {"ru": "<p>Каменная колонна с античной чашей, в которой сжигали смолу — для вентиляции (разлагающиеся останки делали воздух непригодным для дыхания) и как погребальный огонь, продолжая традицию «lanterne des morts».</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lamp.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lamp-1816.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A stone column with an antique bowl in which resin was burned — both for ventilation (decomposing remains made the air unfit to breathe) and as a funerary fire, continuing the tradition of the «lanterne des morts».</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lamp.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/lamp-1816.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "barrel", "lat": 48.8322, "lng": 2.3355, "lb": {"ru": "БОЧКА СТРАСТЕЙ", "en": "BARREL OF PASSIONS"}, "t": {"ru": "Бочка Страстей", "en": "The Barrel of Passions"}, "s": {"ru": "Ротонда Голеней · Тайный концерт 1897 года", "en": "Rotunda of the Tibias · Secret concert of 1897"}, "h": {"ru": "<p>Бочкообразная структура из голеней и черепов, скрывающая опорную колонну — декоративная маскировка инженерного решения.</p><div class=\"p-sc\">Тайный концерт 1897</div><p>2 апреля 1897 года ~100 представителей высшего общества получили таинственные приглашения на 23:00. 45 музыкантов Парижской оперы исполнили Похоронный марш Шопена, Пляску смерти Сен-Санса и Героическую симфонию Бетховена среди костей до 2 часов ночи.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A barrel-shaped structure of tibias and skulls that conceals a support pillar — decorative camouflage for an engineering solution.</p><div class='p-sc'>The secret concert of 1897</div><p>On 2 April 1897, ~100 members of high society received mysterious invitations for 11 p.m. Forty-five musicians from the Paris Opera performed Chopin’s Funeral March, Saint-Saëns’ Danse macabre and Beethoven’s Eroica among the bones until 2 in the morning.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/barrel-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "philibert", "lat": 48.834, "lng": 2.337, "lb": {"ru": "ФИЛИБЕР АСПАР", "en": "PHILIBERT ASPAIRT"}, "t": {"ru": "Могила Филибера Аспара", "en": "The Grave of Philibert Aspairt"}, "s": {"ru": "Патрон катафилов · Потерян 1793 · Найден 1804", "en": "Patron of the cataphiles · Lost 1793 · Found 1804"}, "h": {"ru": "<p>Филибер Аспар, привратник военного госпиталя Валь-де-Грас, вошёл в катакомбы 3 ноября 1793 года с единственной свечой. Она погасла. Он больше не нашёл дорогу назад.</p><div class=\"p-sc\">Одиннадцать лет</div><p>Его тело нашли 30 апреля 1804 года — всего в нескольких метрах от выхода. Опознали по связке ключей госпиталя.</p><div class=\"p-qt\">«Tout cataphile se doit d’aller rendre visite à Philibert.»<br><small>«Каждый катафил должен навестить Филибера.»</small></div><p>Каждое 3 ноября катафилы зажигают свечи у его могилы.</p><p><a href=\"https://www.catacombes.xyz/explore/philibert\" target=\"_blank\" style=\"color:#b08d57\">➡ Смотреть в 3D на catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-acte.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Philibert Aspairt, a doorkeeper at the Val-de-Grâce military hospital, entered the catacombs on 3 November 1793 with a single candle. It went out. He never found his way back.</p><div class='p-sc'>Eleven years</div><p>His body was found on 30 April 1804 — only a few metres from an exit. He was identified by the hospital’s ring of keys.</p><div class='p-qt'>«Tout cataphile se doit d’aller rendre visite à Philibert.»<br><small>«Every cataphile must pay a visit to Philibert.»</small></div><p>Every 3 November the cataphiles light candles at his grave.</p><p><a href='https://www.catacombes.xyz/explore/philibert' target='_blank' style='color:#b08d57'>➡ View in 3D at catacombes.xyz</a></p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-tomb-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/philibert-acte.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "salle-z", "lat": 48.8405, "lng": 2.339, "lb": {"ru": "ЗАЛ Z", "en": "ROOM Z"}, "t": {"ru": "Зал Z", "en": "Room Z"}, "s": {"ru": "Семиметровые своды · Ла-Кагуль · Рейвы 1980-х", "en": "Seven-metre vaults · La Cagoule · 1980s raves"}, "h": {"ru": "<p>Семиметровая галерея с романскими сводами под Валь-де-Грас. Изначально — фундамент для недостроенной церкви. Название дала La Cagoule (Comité secret d’action révolutionnaire) — крайне правая подпольная организация 1930-х, планировавшая свержение правительства Народного фронта. Они использовали подземелья для хранения оружия и тайных собраний.</p><div class=\"p-sc\">Современная легенда</div><p>Место массовых вечеринок 1980-х. Чтобы добраться, нужно ползти через шатьеры — узкие лазы едва шире тела.</p><!-- PLACEHOLDER: YouTube видео исследования Зала Z --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-3.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-4.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-5.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A seven-metre gallery with Romanesque vaults beneath Val-de-Grâce. Originally the foundation for a church that was never finished. Its name comes from La Cagoule (the Comité secret d’action révolutionnaire) — a far-right underground organisation of the 1930s that plotted to overthrow the Popular Front government. They used the tunnels to store weapons and hold secret meetings.</p><div class='p-sc'>A modern legend</div><p>A venue for mass parties in the 1980s. To reach it you have to crawl through chatières — passages barely wider than a body.</p><!-- PLACEHOLDER: YouTube видео исследования Зала Z --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-3.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-4.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/salle-z-5.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "la-plage", "lat": 48.8265, "lng": 2.336, "lb": {"ru": "ЛЯ ПЛЯЖ", "en": "LA PLAGE"}, "t": {"ru": "Ля Пляж — Пляж", "en": "La Plage — The Beach"}, "s": {"ru": "«Таймс-сквер катакомб» · Фреска «Волна» Хокусая", "en": "«Times Square of the catacombs» · Hokusai’s «Wave» mural"}, "h": {"ru": "<p>Самое знаменитое место встречи катафилов. Огромный зал с песчаным полом (из закрытой в 1970 пивоварни) и высокими известняковыми сводами. Стены покрыты росписями, включая репродукцию «Большой волны» Хокусая работы катафила Psyckose.</p><div class=\"p-sc\">По ночам</div><p>Диджеи, группы, кочующие вечеринки. Некоторые художники несли почти тонну материалов через 5 км тоннелей.</p><!-- PLACEHOLDER: YouTube видео катафилов на Ля Пляж --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-plage.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-plage-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The most famous cataphile meeting spot. A huge hall with a sandy floor (from a brewery that closed in 1970) and high limestone vaults. The walls are covered in paintings, including a reproduction of Hokusai’s «Great Wave» by the cataphile Psyckose.</p><div class='p-sc'>At night</div><p>DJs, bands, roaming parties. Some artists hauled nearly a tonne of materials through 5 km of tunnels.</p><!-- PLACEHOLDER: YouTube видео катафилов на Ля Пляж --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-plage.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/la-plage-2.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "chateau", "lat": 48.824, "lng": 2.336, "lb": {"ru": "ЗАМОК", "en": "THE CASTLE"}, "t": {"ru": "Зал Замок", "en": "The Castle Room"}, "s": {"ru": "Вырезанные вручную горгульи · Построен «Жеже»", "en": "Hand-carved gargoyles · Built by «Gégé»"}, "h": {"ru": "<p>Построен ~20 лет назад катафилом «Жеже». Вырезанные горгульи, каменные скамьи, круглый стол, миниатюрный средневековый замок, кованая люстра и «замковый сад» с искусственными лианами. Вандалы разрушили — сообщество восстановило.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/chateau.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/chateau-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Built about 20 years ago by a cataphile known as «Gégé». Carved gargoyles, stone benches, a round table, a miniature medieval castle, a wrought-iron chandelier and a «castle garden» with artificial vines. Vandals destroyed it — the community rebuilt it.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/chateau.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/chateau-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "carrefour", "lat": 48.8345, "lng": 2.329, "lb": {"ru": "ПЕРЕКРЁСТОК МЁРТВЫХ", "en": "CROSSROADS OF THE DEAD"}, "t": {"ru": "Перекрёсток Мёртвых", "en": "The Crossroads of the Dead"}, "s": {"ru": "Под кладбищем Монпарнас", "en": "Beneath Montparnasse Cemetery"}, "h": {"ru": "<p>Прямо под кладбищем Монпарнас. Семь костных захоронений из переполненных кладбищ, строительных раскопок и эпидемий холеры. Регулярно разграблялись охотниками за мрачными сувенирами. Двухуровневые галереи, 20 лет инженерных работ.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/carrefour-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Directly beneath Montparnasse Cemetery. Seven bone deposits from overflowing cemeteries, construction digs and cholera epidemics. They were regularly looted by hunters of macabre souvenirs. Two-level galleries, twenty years of engineering work.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/carrefour-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "capucins", "lat": 48.8365, "lng": 2.34, "lb": {"ru": "КАПУЦИНЫ", "en": "THE CAPUCINS"}, "t": {"ru": "Каменоломня Капуцинов", "en": "The Capucins Quarry"}, "s": {"ru": "Первый подземный памятник · Под госпиталем Кошен", "en": "First underground monument · Beneath the Cochin hospital"}, "h": {"ru": "<p>Carrières des Capucins — единственная легально доступная часть нелегальной сети (не считая оссуария). 1200 м галерей на глубине 18 м, постоянная температура 13°C, влажность 95%. Управляется ассоциацией SEADACC, которая проводит экскурсии при свечах.</p><div class=\"p-sc\">Под 14-м округом</div><p>Расположены под госпиталем Кошен. Здесь можно увидеть подлинные техники добычи камня и укрепления галерей — от средневековых до XIX века. Фонтан Капуцинов и роза ветров на потолке сохранились в оригинальном виде.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/capucins-extra-1.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The Carrières des Capucins — the only legally accessible part of the illegal network (apart from the ossuary). 1,200 m of galleries at a depth of 18 m, a constant 13°C and 95% humidity. It is run by the SEADACC association, which gives candlelit tours.</p><div class='p-sc'>Beneath the 14th arrondissement</div><p>It lies under the Cochin hospital. Here you can see genuine techniques of stone extraction and gallery reinforcement — from the medieval period to the 19th century. The Capucins fountain and the compass rose on the ceiling survive in their original state.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/capucins-extra-1.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "tombe-issoire", "lat": 48.8258, "lng": 2.3365, "lb": {"ru": "ТОМБ-ИССУАР", "en": "TOMBE-ISSOIRE"}, "t": {"ru": "Томб-Иссуар — Легенда о великане", "en": "Tombe-Issoire — Legend of the giant"}, "s": {"ru": "Великан Изоре · Первый оссуарий · XV век", "en": "The giant Isoré · First ossuary · 15th century"}, "h": {"ru": "<p>Название улицы происходит от легенды XII века о великане Изоре — короле Коимбры, втрое выше обычного человека, осадившем Париж с 20 000 сарацинами и убитом Гийомом Оранским. Похоронен на месте гибели. Жерве Тильберийский (Gervase of Tilbury, ~1150–1228) — англо-нормандский хронист, маршал Арльского королевства, автор «Otia Imperialia» (Императорских досугов), энциклопедии чудес и легенд — видел гробницу: «двадцать футов в длину». Каменоломни Томб-Иссуар были выбраны в 1786 году для оссуария не из-за легенды, а потому что находились за городской стеной и были легко доступны через колодец на территории поместья «La maison de la Tombe-Issoire».</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/tombe-issoire.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>The street’s name comes from a 12th-century legend about the giant Isoré — king of Coimbra, three times the height of an ordinary man, who laid siege to Paris with 20,000 Saracens and was killed by William of Orange. He was buried where he fell. Gervase of Tilbury (~1150–1228) — an Anglo-Norman chronicler, marshal of the Kingdom of Arles and author of «Otia Imperialia» (Recreation for an Emperor), an encyclopaedia of marvels and legends — saw the tomb: «twenty feet long». The Tombe-Issoire quarries were chosen for the ossuary in 1786 not because of the legend, but because they lay outside the city wall and were easily reached through a well on the grounds of the estate «La maison de la Tombe-Issoire».</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/tombe-issoire.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "igc", "lat": 48.8342, "lng": 2.332, "lb": {"ru": "IGC", "en": "IGC"}, "t": {"ru": "Генеральная инспекция каменоломен", "en": "The General Inspectorate of Quarries"}, "s": {"ru": "Спасает Париж от обрушения с 1777 года", "en": "Saving Paris from collapse since 1777"}, "h": {"ru": "<p>Основана 4 апреля 1777 года после катастрофы на улице Анфер. Первый инспектор: Шарль-Аксель Гийомо (1730–1807), обследовавший в масштабе 1:216 — точнее любой наземной карты.</p><div class=\"p-sc\">Потолочные таблички</div><p>Каменные таблички на стенах галерей показывают название улицы наверху, стороны света, дату и инициалы инспектора. Многие сохранили исчезнувшие названия улиц. Из 200+ королевских лилий (fleur-de-lys — символ французской монархии), вырезанных инспекторами на стенах галерей как знак завершённых работ, сохранилось всего 7. Остальные были сбиты после Революции.</p><div class=\"p-ft\"><b>Основана</b> 4 апреля 1777</div><div class=\"p-ft\"><b>Сеть</b> ~300 км под наблюдением</div><div class=\"p-ft\"><b>Обвалы</b> ~7 в год до сих пор</div>", "en": "<p>Founded on 4 April 1777, after the disaster on Rue d’Enfer. Its first inspector was Charles-Axel Guillaumot (1730–1807), who surveyed at a scale of 1:216 — more precise than any map above ground.</p><div class='p-sc'>Ceiling plaques</div><p>Stone plaques on the gallery walls record the name of the street overhead, the points of the compass, the date and the inspector’s initials. Many preserve street names that have since vanished. Of the 200+ royal lilies (fleur-de-lys — the symbol of the French monarchy) carved by inspectors on the walls to mark completed work, only 7 survive. The rest were chiselled off after the Revolution.</p><div class='p-ft'><b>Founded</b> 4 April 1777</div><div class='p-ft'><b>Network</b> ~300 km under watch</div><div class='p-ft'><b>Collapses</b> ~7 a year, still today</div>"}}, {"id": "enfer", "lat": 48.835, "lng": 2.3335, "lb": {"ru": "УЛИЦА АНФЕР 1774", "en": "RUE D’ENFER 1774"}, "t": {"ru": "Улица Анфер — Обвал 1774 года", "en": "Rue d’Enfer — The 1774 collapse"}, "s": {"ru": "17 декабря 1774 · 300 м провалилось · «Пасть Ада»", "en": "17 December 1774 · 300 m caved in · «Mouth of Hell»"}, "h": {"ru": "<p>17 декабря 1774 года почти 300 метров улицы Анфер провалились на глубину 25 метров, поглотив дома в то, что свидетели назвали «la Bouche d’Enfer» — Пасть Ада. Людовик XVI запретил добычу камня (1776) и создал IGC — Inspection Générale des Carrières, Генеральную инспекцию каменоломен (1777). «Rue d’Enfer» — вероятно, искажённое латинское Via Inferior, «нижняя дорога» (дорога шла в низину). Переименована в «Denfert-Rochereau» в 1879 году в честь полковника Пьера Данфера-Рошеро, героя осады Бельфора (1870–71). Созвучие «d’Enfer» / «Denfert» — намеренный муниципальный каламбур: адрес потерял «ад», но сохранил его звучание.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/enfer.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/enfer-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>On 17 December 1774 almost 300 metres of Rue d’Enfer caved in to a depth of 25 metres, swallowing houses into what witnesses called «la Bouche d’Enfer» — the Mouth of Hell. Louis XVI banned quarrying (1776) and created the IGC — Inspection Générale des Carrières, the General Inspectorate of Quarries (1777). «Rue d’Enfer» is probably a corruption of the Latin Via Inferior, «the lower road» (the road ran down into a hollow). It was renamed «Denfert-Rochereau» in 1879 after Colonel Pierre Denfert-Rochereau, hero of the siege of Belfort (1870–71). The echo between «d’Enfer» and «Denfert» is a deliberate municipal pun: the address lost its «hell» but kept the sound of it.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/enfer.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/enfer-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "ffr", "lat": 48.834, "lng": 2.3325, "lb": {"ru": "ШТАБ FFI 1944", "en": "FFI HQ 1944"}, "t": {"ru": "Командный пункт Роль-Танги", "en": "Rol-Tanguy’s Command Post"}, "s": {"ru": "Штаб FFI · 20–28 августа 1944", "en": "FFI headquarters · 20–28 August 1944"}, "h": {"ru": "<p>Полковник Роль-Танги разместил штаб Французских внутренних сил в убежище под площадью Данфер-Рошеро на глубине 26 м. Связь с ~250 телефонными станциями. Командовал ~100 000 бойцами, освобождавшими Париж.</p><div class=\"p-sc\">500 метров друг от друга</div><p>Бункер Люфтваффе под лицеем Монтеня был всего в ~500 м. Ни одна сторона не знала о другой. Немецкие надписи сохранились: «RUHE», «RAUCHEN VERBOTEN». Сейчас — часть Музея Освобождения.</p><!-- PLACEHOLDER: YouTube видео экскурсии по бункеру Музея Освобождения --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ffr.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Colonel Rol-Tanguy set up the headquarters of the French Forces of the Interior in a shelter beneath Place Denfert-Rochereau, 26 m down. It was linked to ~250 telephone exchanges. From here he commanded the ~100,000 fighters who liberated Paris.</p><div class='p-sc'>500 metres apart</div><p>A Luftwaffe bunker beneath the Lycée Montaigne was only ~500 m away. Neither side knew about the other. The German inscriptions survive: «RUHE», «RAUCHEN VERBOTEN». Today it is part of the Liberation Museum.</p><!-- PLACEHOLDER: YouTube видео экскурсии по бункеру Музея Освобождения --><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/ffr.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cinema", "lat": 48.863, "lng": 2.287, "lb": {"ru": "КИНОТЕАТР 2004", "en": "CINEMA 2004"}, "t": {"ru": "Подпольный кинотеатр", "en": "The Underground Cinema"}, "s": {"ru": "Под Трокадеро · «Ne cherchez pas»", "en": "Beneath the Trocadéro · «Ne cherchez pas»"}, "h": {"ru": "<p>В сентябре 2004 полиция обнаружила под Трокадеро кинотеатр на 280 м²: экран, 20 каменных кресел, проектор, бар, ресторан, звуковая система с записью лая собак, три телефонные линии, пиратское электричество. Построен в 1999–2001 La Mexicaine de Perforation — подразделением UX (Urban eXperiment), тайной организации городских художников-активистов, действующей в Париже с 1980-х. UX специализируется на нелегальной реставрации и создании культурных пространств в заброшенных местах города.</p><div class=\"p-qt\">«Ne cherchez pas.»<br><small>«Не ищите.»</small></div><p>Когда полиция вернулась через несколько дней, всё оборудование бесследно исчезло. На месте кинотеатра осталась только записка: «Не ищите». UX также тайно отреставрировали сломанные часы XIX века в Пантеоне.</p><!-- PLACEHOLDER: YouTube видео/документальный фильм о подпольном кинотеатре UX -->", "en": "<p>In September 2004 the police discovered a 280 m² cinema beneath the Trocadéro: a screen, 20 stone seats, a projector, a bar, a restaurant, a sound system playing recorded dog barks, three telephone lines and pirated electricity. It was built in 1999–2001 by La Mexicaine de Perforation — a wing of UX (Urban eXperiment), a secret organisation of urban artist-activists active in Paris since the 1980s. UX specialises in the illegal restoration and creation of cultural spaces in the city’s abandoned places.</p><div class='p-qt'>«Ne cherchez pas.»<br><small>«Do not look for us.»</small></div><p>When the police returned a few days later, every piece of equipment had vanished without a trace. All that was left on the cinema site was a note: «Do not look for us». UX also secretly restored a broken 19th-century clock in the Panthéon.</p><!-- PLACEHOLDER: YouTube видео/документальный фильм о подпольном кинотеатре UX -->"}}, {"id": "val-de-grace", "lat": 48.841, "lng": 2.344, "lb": {"ru": "ВАЛЬ-ДЕ-ГРАС", "en": "VAL-DE-GRÂCE"}, "t": {"ru": "Валь-де-Грас — Фундамент над пустотой", "en": "Val-de-Grâce — A foundation over the void"}, "s": {"ru": "Госпиталь XVII в. · Самые дорогие фундаменты Парижа", "en": "17th-c. hospital · The most expensive foundations in Paris"}, "h": {"ru": "<p>Королева Анна Австрийская повелела построить этот госпиталь в 1645 году в благодарность за рождение наследника — будущего Людовика XIV. Но под участком оказались огромные каменоломни, и большая часть бюджета ушла на укрепление фундамента. Первое в истории Парижа столкновение наземного строительства с подземным хаосом.</p><div class=\"p-sc\">Лабиринт Валь-де-Грас</div><p>Подземная часть получила отдельное название: «Лабиринт Валь-де-Грас». Здесь катафилы реально теряются — запутанная система низких ходов без ориентиров. Именно отсюда Филибер Аспар вошёл в катакомбы в 1793 году и больше не вышел. А прямо под зданием — Зал Z с семиметровыми сводами.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-12.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-14.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-15.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-16.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-17.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-18.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>Queen Anne of Austria ordered this hospital built in 1645 in thanks for the birth of an heir — the future Louis XIV. But beneath the site lay vast quarries, and most of the budget went into reinforcing the foundations. It was the first time in the history of Paris that building above ground collided with the chaos below.</p><div class='p-sc'>The Val-de-Grâce labyrinth</div><p>The underground section got its own name: the «Val-de-Grâce labyrinth». Cataphiles really do get lost here — a tangled system of low passages with no landmarks. It was from here that Philibert Aspairt entered the catacombs in 1793 and never came out. And directly beneath the building is Room Z, with its seven-metre vaults.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-12.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-14.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-15.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-16.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-17.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/val-de-grace-18.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "bunker-luftwaffe", "lat": 48.845, "lng": 2.335, "lb": {"ru": "БУНКЕР ЛЮФТВАФФЕ", "en": "LUFTWAFFE BUNKER"}, "t": {"ru": "Бункер Люфтваффе под лицеем Монтеня", "en": "Luftwaffe bunker beneath the Lycée Montaigne"}, "s": {"ru": "6-й округ · ~500 м от штаба FFI · Немецкие надписи на стенах", "en": "6th arr. · ~500 m from FFI HQ · German inscriptions on the walls"}, "h": {"ru": "<p>В 1943–44 годах Вермахт построил подземный бункер прямо под лицеем Монтеня в 6-м округе — всего в 500 метрах от штаба Сопротивления. Самая безумная деталь: ни одна сторона не подозревала о существовании другой. Две враждующие армии буквально под одной землёй.</p><div class=\"p-sc\">Следы оккупации</div><p>На стенах до сих пор — немецкие надписи: «RUHE» (тишина), «RAUCHEN VERBOTEN» (курить запрещено). Широкие галереи бункера выглядят инородно среди узких средневековых тоннелей — как модернистская врезка в готический текст. Огромные стальные двери, электропроводка времён войны, лестницы к поверхности.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-12.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>In 1943–44 the Wehrmacht built an underground bunker directly beneath the Lycée Montaigne in the 6th arrondissement — only 500 metres from the headquarters of the Resistance. The maddest detail: neither side suspected the other existed. Two warring armies, literally under the same ground.</p><div class='p-sc'>Traces of the occupation</div><p>German inscriptions are still on the walls: «RUHE» (silence), «RAUCHEN VERBOTEN» (no smoking). The bunker’s wide galleries look alien among the narrow medieval tunnels — like a modernist insertion into a Gothic text. Huge steel doors, wartime wiring, staircases up to the surface.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-8.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-9.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-10.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-11.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-12.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-13.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/bunker-luftwaffe-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "cabinet-mineral", "lat": 48.833, "lng": 2.336, "lb": {"ru": "МИНЕР. КАБИНЕТ", "en": "MINERAL CABINET"}, "t": {"ru": "Минералогический кабинет", "en": "The Mineralogical Cabinet"}, "s": {"ru": "Cabinet Minéralogique · Первый подземный музей в мире", "en": "Cabinet Minéralogique · The first underground museum in the world"}, "h": {"ru": "<p>Квадратный зал с каменной лестницей в центре, на ступенях которой Луи-Этьен Эрикар де Тюри (1776–1854), директор Генеральной инспекции каменоломен (IGC), выставлял образцы горных пород парижских каменоломен — от лютецианского известняка до мергеля и глины. По сути — первый геологический музей в мире, расположенный прямо в горной породе, которую он описывает.</p><div class=\"p-sc\">Сегодня</div><p>Образцы давно исчезли, но лестница стоит. Катафилы узнают кабинет по характерной квадратной форме — он служит ориентиром в 300-километровом лабиринте, где навигация без карты смертельно опасна.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">", "en": "<p>A square hall with a stone staircase in the centre, on whose steps Louis-Étienne Héricart de Thury (1776–1854), director of the General Inspectorate of Quarries (IGC), displayed rock samples from the Paris quarries — from Lutetian limestone to marl and clay. In effect, the first geological museum in the world, set right inside the rock it describes.</p><div class='p-sc'>Today</div><p>The samples vanished long ago, but the staircase still stands. Cataphiles recognise the cabinet by its distinctive square shape — it serves as a landmark in a 300-kilometre labyrinth where navigating without a map can be fatal.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-6.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-7.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/cabinet-mineral-extra-1.jpg\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">"}}, {"id": "librairie", "lat": 48.833, "lng": 2.338, "lb": {"ru": "БИБЛИОТЕКА", "en": "THE LIBRARY"}, "t": {"ru": "Ля Либрери — Подземная библиотека", "en": "La Librairie — The underground library"}, "s": {"ru": "La Librairie · Книжный обмен на глубине 20 м", "en": "La Librairie · A book exchange 20 m down"}, "h": {"ru": "<p>Небольшая ниша в стене, превращённая катафилами в библиотеку. Правило простое: берёшь книгу — оставь другую. На полках — от Камю до комиксов, от подземных путеводителей до сборников поэзии. Всё это на глубине 20 метров, при 14°C и абсолютной тишине.</p><div class=\"p-sc\">Зачем читать в темноте</div><p>Катафилы проводят под землёй по 12–24 часа. Библиотека — доказательство того, что подземный Париж — не просто тоннели, а параллельное общество со своей культурой, инфраструктурой и странной нежностью.</p>", "en": "<p>A small niche in the wall that cataphiles turned into a library. The rule is simple: take a book — leave another. On the shelves you’ll find everything from Camus to comics, from underground guidebooks to poetry collections. All of it 20 metres down, at 14°C and in absolute silence.</p><div class='p-sc'>Why read in the dark</div><p>Cataphiles spend 12–24 hours underground at a time. The library is proof that underground Paris is not just tunnels but a parallel society with its own culture, infrastructure and strange tenderness.</p>"}}, {"id": "galerie-promos", "lat": 48.833, "lng": 2.339, "lb": {"ru": "ГАЛЕРЕЯ ПРОМО", "en": "GALERIE DES PROMOS"}, "t": {"ru": "Галерея Промо — Фрески Горной школы", "en": "Galerie des Promos — Murals of the School of Mines"}, "s": {"ru": "Galerie des Promos · Ежегодная традиция с XIX века", "en": "Galerie des Promos · An annual tradition since the 19th century"}, "h": {"ru": "<p>Каждый год выпускники Парижской горной школы (École des Mines, основана в 1783) спускаются под землю и расписывают стены фреской своего выпуска. Традиция длится больше века — стены покрыты десятками работ, от наивных до виртуозных.</p><div class=\"p-sc\">Институциональное граффити</div><p>Единственное место в катакомбах, где «граффити» — не вандализм, а академическая традиция. Каждая фреска подписана годом и именами выпускников. Некоторые студенты приносили литры краски через километры тоннелей ради нескольких часов рисования.</p><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-2.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-3.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-4.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" src=\"https://raw.githubusercontent.com/aleleosedova/surprise/main/images/galerie-promos-5.png\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\"><img class=\"p-img\" sr
